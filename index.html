<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hipocráticos no Circuito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: caderno de bancada quadriculado; cada estação é uma cor de etiqueta de amostra; o cronômetro e o placar são os objetos centrais. */
:root{
  --bg:#EEF2F0; --grid:#DDE4E1; --paper:#FAFCFB; --ink:#16212A; --muted:#5B6B70; --line:#C9D3D0;
  --bertha:#7B3F8C; --sonja:#1E5AA8; --apgar:#C2413B; --johanna:#2E7D4F; --enigma:#9A6A12;
  --ok:#1F7A4A; --okbg:#E3F3EA; --bad:#B42D2D; --badbg:#FBE7E5; --gold:#B7791F;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1518; --grid:#18211F; --paper:#151D20; --ink:#E5ECEA; --muted:#93A3A6; --line:#2A3639;
  --bertha:#C08AD1; --sonja:#7FAEEB; --apgar:#EE8A83; --johanna:#7CC79B; --enigma:#E2B45A;
  --ok:#7CD3A1; --okbg:#173327; --bad:#F29A92; --badbg:#3A1C1A; --gold:#E9B65C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1518; --grid:#18211F; --paper:#151D20; --ink:#E5ECEA; --muted:#93A3A6; --line:#2A3639;
  --bertha:#C08AD1; --sonja:#7FAEEB; --apgar:#EE8A83; --johanna:#7CC79B; --enigma:#E2B45A;
  --ok:#7CD3A1; --okbg:#173327; --bad:#F29A92; --badbg:#3A1C1A; --gold:#E9B65C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sonja);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);max-width:65ch}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}

/* Entrada */
.hero{display:grid;gap:16px;padding-block:20px 4px}
.hero h1{font-size:clamp(44px,10vw,92px);font-weight:800;letter-spacing:-.03em}
.tubes{display:flex;gap:6px;height:10px}
.tubes span{flex:1;border-radius:3px}
.count{display:flex;gap:18px;flex-wrap:wrap;align-items:end}
.count div{display:grid}
.count b{font-family:var(--mono);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:10px;transition:border-color .15s,transform .15s}
.person:hover{border-color:var(--ink);transform:translateY(-2px)}
.person h3{font-size:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1.5px solid currentColor;line-height:1.4}
.chip.fill{color:var(--paper)!important;border-color:transparent}

/* Topo */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top .who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.top h2{font-size:28px}

/* Home */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mode{display:grid;gap:10px;align-content:start}
.mode h3{font-size:26px}
.lvlbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lvlbar span{height:8px;border-radius:2px;background:var(--grid)}
.lvlbar span.on{background:var(--ink)}

/* Placar */
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.board td{padding:10px 8px;border-bottom:1px solid var(--line)}
.board td.n,.board th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.board tr.me td{background:var(--grid)}
.pos{font-family:var(--mono);font-weight:700;width:2.2em}
.pos.p1{color:var(--gold)}
.scroll{overflow-x:auto}
.stations{display:grid;gap:8px;margin-top:6px}
.srow{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.sync{font-size:12px;color:var(--muted)}

/* Questão */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.qtext{font-size:18px;font-weight:500;line-height:1.5;max-width:65ch}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.numrow input{font-family:var(--mono);font-size:18px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:min(220px,100%)}
.numrow input.txtin{font-family:var(--body);width:min(360px,100%)}
.ordpool{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ordpool button{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 12px;font-weight:600;text-align:left}
.ordpool button:hover:not(:disabled){border-color:var(--ink)}
.ordpool button:disabled{opacity:.3}
.ordpick{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;counter-reset:o}
.ordpick li{counter-increment:o;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;background:var(--grid);font-weight:600}
.ordpick li::before{content:counter(o);font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.4em}
.ordpick li.right{background:var(--okbg);color:var(--ok)} .ordpick li.wrong{background:var(--badbg);color:var(--bad)}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.fb{margin-top:16px;padding:14px 16px;border-radius:6px;border-left:4px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb b{display:block;margin-bottom:4px}
.lvl{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hud .pts{font-family:var(--mono);font-size:22px;font-weight:700}
.toast{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ok)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--grid);display:block}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.now{background:var(--ink)}

/* Simulado */
.clock{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding:18px 20px;background:var(--ink);color:var(--paper);border-radius:8px;margin-bottom:14px}
.clock .t{font-family:var(--mono);font-size:clamp(40px,9vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.clock .pen{font-family:var(--mono);font-size:14px;opacity:.85}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.track div{height:30px;border-radius:5px;border:1.5px dashed var(--line);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 4px;text-align:center;overflow:hidden}
.track div.done{border-style:solid;color:var(--paper)}
.track div.now{border-style:solid;border-color:var(--ink);color:var(--ink)}
.clue{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.2}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.room{border:2px solid currentColor;background:var(--paper);border-radius:6px;padding:14px;font-weight:700;text-align:left}
.room:disabled{opacity:.35;text-decoration:line-through}
.phone{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:6px;border:2px solid;font-weight:700}
.phone.on{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.phone.off{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.phone svg{flex:none}
.bench{border:1.5px dashed var(--line);border-radius:6px;padding:14px;font-size:14px}
.bench table{border-collapse:collapse;font-size:13px}
.bench td,.bench th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.hold{text-align:center;padding:24px 16px}
.hold .t{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--bad)}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td,table.res th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.res .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:clamp(48px,12vw,80px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
ul.rules{margin:0;padding-left:1.2em;display:grid;gap:6px}
.guidebtn{margin-top:10px;border:1.5px solid var(--bad);background:var(--paper);color:var(--bad);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,18,.72);display:flex;justify-content:center;overflow-y:auto;
  padding-top:calc(16px + env(safe-area-inset-top, 0px));padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px))}
.modal .sheet{background:var(--paper);border-radius:8px;max-width:820px;width:100%;align-self:flex-start;overflow:hidden}
.modal .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.modal img{display:block;width:100%;height:auto;background:#fff}
.modal a{color:var(--sonja);font-weight:600}
.bordao{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(20px) rotate(-2deg);opacity:0;pointer-events:none;z-index:50;
  font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,34px);line-height:1.1;padding:14px 22px;border-radius:8px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-width:calc(100% - 32px);text-align:center;transition:opacity .2s,transform .25s}
.bordao{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 10px 14px!important}
.bordao img{display:block;width:clamp(140px,40vw,190px);height:auto;aspect-ratio:9/16;object-fit:cover;max-width:100%;border-radius:4px;border:2px solid var(--ink)}
.bordao.ok{background:var(--okbg);color:var(--ok)}
.bordao.bad{background:var(--badbg);color:var(--bad)}
.bordao.show{opacity:1;transform:translateX(-50%) translateY(0) rotate(-2deg)}
.bordao small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.sound{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
@media (max-width:520px){ .srow{grid-template-columns:84px 1fr 56px} .track div{font-size:9px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
<meta name="description" content="Treino da equipe Hipocráticos para o Circuito Ciência Delas · 12ª JIEPE UFTM">
</head>
<body>

<main class="wrap" id="app"></main>
<div class="bordao" id="bordao" role="status" aria-live="polite"></div>
<div class="modal" id="guideModal" hidden role="dialog" aria-modal="true" aria-label="Trecho do guia"><div class="sheet">
  <div class="bar2"><b id="guideTitle">Guia</b><div class="row"><a id="guidePdf" href="guia.pdf" target="_blank" rel="noopener">Abrir o PDF nesta página</a><button class="btn" id="guideClose" type="button">Fechar</button></div></div>
  <img id="guideImg" alt="Página do guia de preparação">
</div></div>

<script>
/* ---------------- Dados fixos ---------------- */
const ST = {
  bertha:{name:"Bertha Lutz", c:"--bertha"},
  sonja:{name:"Sonja Ashauer", c:"--sonja"},
  apgar:{name:"Virginia Apgar", c:"--apgar"},
  johanna:{name:"Johanna Döbereiner", c:"--johanna"},
  enigma:{name:"Enigmas", c:"--enigma"}
};
const STATIONS = ["bertha","sonja","apgar","johanna"];
const PEOPLE = {
  gabriel:{name:"Gabriel", capt:["sonja","apgar"], res:[]},
  xororo:{name:"Xororó", capt:["bertha"], res:["apgar","johanna"]},
  zelele:{name:"Zélelé", capt:["johanna"], res:["bertha","sonja"]}
};
const LV = {1:"Fácil",2:"Médio",3:"Difícil"};
const ROUND = 8;

/* ================= Banco de questões =================
   Tipos:
   txt  resposta escrita: ac = respostas aceitas (a primeira é a exibida)
   num  resposta numérica: n = valor, tol = tolerância absoluta, u = unidade
   mc   múltipla escolha: o = opções, a = índice certo
   ord  ordenar: o = itens já na ordem correta (a tela embaralha)
   c:1  questão de consulta (só nas estações com celular liberado do simulado)
   g    página do guia em PDF que explica o conteúdo
*/
const Q = [
/* ---------------- BERTHA LUTZ ---------------- */
{s:"bertha",l:1,t:"num",q:"Em que ano o Código Eleitoral garantiu às brasileiras o direito de votar e ser votadas?",n:1932,tol:0,u:"",x:"Decreto nº 21.076, de 24 de fevereiro de 1932, no Governo Provisório de Vargas."},
{s:"bertha",l:1,t:"txt",q:"Escreva a sigla da organização feminista que Bertha fundou em 1922.",ac:["FBPF","Federação Brasileira pelo Progresso Feminino"],x:"Federação Brasileira pelo Progresso Feminino, que ela presidiu por cerca de 20 anos."},
{s:"bertha",l:1,t:"txt",q:"Em que museu do Rio de Janeiro Bertha trabalhou como bióloga?",ac:["Museu Nacional"],x:"Entrou por concurso em 1919, uma das primeiras mulheres no serviço público federal."},
{s:"bertha",l:1,t:"txt",q:"Em que universidade de Paris Bertha estudou Ciências Naturais?",ac:["Sorbonne","Universidade de Paris"],x:"Sorbonne. Depois ela cursou também Direito no Brasil."},
{s:"bertha",l:1,t:"txt",q:"Qual país foi o primeiro a garantir o voto feminino em nível nacional, em 1893?",ac:["Nova Zelândia"],x:"Nova Zelândia, 1893. Brasil só em 1932."},
{s:"bertha",l:1,t:"txt",q:"Qual chefe de governo assinou o Código Eleitoral de 1932?",ac:["Getúlio Vargas","Vargas"],x:"Getúlio Vargas, à frente do Governo Provisório após a Revolução de 1930."},
{s:"bertha",l:1,t:"num",q:"Qual o número do ODS da Agenda 2030 sobre igualdade de gênero (o ODS desta JIEPE)?",n:5,tol:0,u:"",x:"ODS 5 · Igualdade de Gênero."},
{s:"bertha",l:1,t:"txt",q:"Como bióloga, Bertha estudava sapos, rãs e pererecas. Qual o nome desse grupo de animais?",ac:["anfíbios","anfíbios anuros","anuros","anfibio"],x:"Anfíbios anuros. Algumas espécies receberam nomes em homenagem a ela."},
{s:"bertha",l:1,t:"txt",q:"Em 1945, Bertha ajudou a pôr a igualdade de gênero no texto de qual documento?",ac:["Carta da ONU","Carta das Nações Unidas"],x:"Na Conferência de São Francisco, como delegada do Brasil."},
{s:"bertha",l:1,t:"txt",q:"Completar: o voto que o Código de 1932 instituiu, além de feminino, era ______ (ninguém via em quem você votou).",ac:["secreto"],x:"O voto secreto também foi uma novidade de 1932, junto com a criação da Justiça Eleitoral."},
{s:"bertha",l:2,t:"num",q:"Quantas mulheres assinaram a Carta da ONU em 1945?",n:4,tol:0,u:"",x:"Bertha Lutz (Brasil), Minerva Bernardino (Rep. Dominicana), Virginia Gildersleeve (EUA) e Wu Yi-fang (China)."},
{s:"bertha",l:2,t:"num",q:"Qual artigo da Carta da ONU impede restrições à participação de homens e mulheres nos órgãos da organização?",n:8,tol:0,u:"",x:"Artigo 8. O Preâmbulo também cita a igualdade de direito dos homens e das mulheres."},
{s:"bertha",l:2,t:"txt",q:"Quem foi a primeira mulher eleita deputada federal no Brasil, em 1933?",ac:["Carlota Pereira de Queirós","Carlota Pereira de Queiroz","Carlota de Queirós","Carlota"],x:"Carlota Pereira de Queirós (SP). Bertha foi a segunda mulher a ocupar uma cadeira."},
{s:"bertha",l:2,t:"txt",q:"Que estado aprovou uma lei permitindo o voto feminino já em 1927?",ac:["Rio Grande do Norte","RN"],x:"No RN, Celina Guimarães Viana (Mossoró) se alistou como primeira eleitora do país."},
{s:"bertha",l:2,t:"txt",q:"Quem foi a primeira eleitora do Brasil, alistada em Mossoró em 1927?",ac:["Celina Guimarães Viana","Celina Guimarães","Celina Viana","Celina"],x:"Celina Guimarães Viana, graças à lei estadual do Rio Grande do Norte."},
{s:"bertha",l:2,t:"txt",q:"Quem foi eleita em 1928 prefeita de Lajes (RN), a primeira prefeita da América Latina?",ac:["Alzira Soriano"],x:"Alzira Soriano."},
{s:"bertha",l:2,t:"num",q:"Em que ano Bertha assumiu a cadeira de deputada federal?",n:1936,tol:0,u:"",x:"Julho de 1936, como suplente, após a morte do titular."},
{s:"bertha",l:2,t:"txt",q:"Que regime fechou o Congresso (e a FBPF) em novembro de 1937?",ac:["Estado Novo"],x:"O Estado Novo de Vargas, instaurado em 10/11/1937."},
{s:"bertha",l:2,t:"num",q:"Ano da primeira Constituição brasileira que incluiu o voto feminino:",n:1934,tol:0,u:"",x:"A Constituição de 1934, que também baixou a idade de voto para 18 anos."},
{s:"bertha",l:2,t:"ord",q:"Coloque em ordem cronológica:",o:["Fundação da FBPF","Voto feminino no Código Eleitoral","Primeira deputada federal eleita","Bertha assume como deputada","Assinatura da Carta da ONU"],x:"1922 → 1932 → 1933 → 1936 → 1945."},
{s:"bertha",l:2,t:"ord",q:"Ordene os países pela data em que adotaram o voto feminino nacional:",o:["Nova Zelândia","Finlândia","Estados Unidos","Brasil","França","Suíça"],x:"1893, 1906, 1920, 1932, 1944, 1971."},
{s:"bertha",l:2,t:"txt",q:"Como se chama o sufrágio em que só vota quem tem determinada renda?",ac:["censitário","sufrágio censitário","voto censitário"],x:"Censitário. Quando depende de instrução, é capacitário."},

let writeTimer = null, writing = Promise.resolve(), pendingDoc = null;
function remoteSet(p, data){
  if(backend==="sb") return fetch(SB_URL+"?on_conflict=pessoa", {method:"POST",
    headers:{apikey:SB_KEY, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"},
    body: JSON.stringify({pessoa:p, dados:data, atualizado:new Date().toISOString()})}).then(r=>{ if(!r.ok) throw {code:"http"}; });
  return db.doc("placar/"+p).set(data);
}
function queueWrite(p, data){
  if(!backend) return;
  pendingDoc = {p, data: JSON.parse(JSON.stringify(data))};
  clearTimeout(writeTimer);
  writeTimer = setTimeout(()=>{ const job = pendingDoc; pendingDoc = null; if(!job) return;
    writing = writing.then(()=>remoteSet(job.p, job.data)).catch(e=>{ dbState = e && e.code==="invalid_argument" ? "readonly" : dbState; updateSync(); }); }, 1200);
}

let soundOn = local.sound !== false, actx = null;
function ac(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){ actx = null; } return actx; }
function tone(freqs, dur, type, vol, delay){
  const c = ac(); if(!c) return; const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = type; f.type = "lowpass"; f.frequency.value = 1800;
  o.frequency.setValueAtTime(freqs[0], t0);
  for(let i=1;i<freqs.length;i++) o.frequency.linearRampToValueAtTime(freqs[i], t0 + dur*i/(freqs.length-1));
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+0.04); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
}

/* ---------------- Questão ---------------- */
const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, d=>"₀₁₂₃₄₅₆₇₈₉".indexOf(d)).replace(/[^a-z0-9]+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function txtOk(ans, ac){ const a = norm(ans); if(!a) return false; const a2 = a.replace(/ /g,"");
  return ac.some(x=>{ const b = norm(x), b2 = b.replace(/ /g,"");
    if(a2===b2) return true;
    if(b2.length>=4 && (" "+a+" ").includes(" "+b+" ")) return true;
    const tol = b2.length>=10?2:b2.length>=5?1:0; return tol>0 && lev(a2,b2)<=tol; }); }
const HINT = {txt:"ESCREVA A RESPOSTA", num:"DIGITE O NÚMERO", mc:"ESCOLHA UMA", ord:"TOQUE NA ORDEM CERTA"};
function rightText(q){ return q.t==="mc" ? q.o[q.a] : q.t==="txt" ? q.ac[0] : q.t==="ord" ? q.o.join(" → ") : fmtNum(q.n) + (q.u?` ${q.u}`:""); }
function questionHTML(q){
  const head = `<div class="qhead"><div class="chips">${chip(q.s,true)}<span class="lvl muted">${q.c?"CONSULTA":LV[q.l].toUpperCase()}</span></div><span class="hint">${HINT[q.t]}</span></div><div class="qtext">${q.q}</div>`;
  if(q.t==="mc"){
    const ord = shuffle(q.o.map((t,i)=>i));
    return head + `<div class="opts">${ord.map((i,k)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${"ABCDE"[k]}</span><span>${q.o[i]}</span></button>`).join("")}</div><div id="fb"></div>`;
  }
  if(q.t==="ord"){
    let mix = shuffle(q.o.map((t,i)=>i)); if(mix.every((v,i)=>v===i)) mix = mix.reverse();
    return head + `<div class="ordpool" id="ordPool">${mix.map(i=>`<button type="button" data-i="${i}">${q.o[i]}</button>`).join("")}</div>
      <ol class="ordpick" id="ordPick"></ol>
      <div class="row" style="margin-top:12px"><button class="btn" id="ordOk" type="button" disabled>Confirmar ordem</button><button class="linkbtn" id="ordUndo" type="button">Desfazer</button></div><div id="fb"></div>`;
  }
  const isNum = q.t==="num";
  return head + `<form class="numrow" id="numForm"><input id="numIn" class="${isNum?"":"txtin"}" ${isNum?'inputmode="decimal"':'autocapitalize="off" spellcheck="false"'} autocomplete="off" placeholder="${isNum?"Número":"Sua resposta"}" aria-label="Resposta">
    ${isNum&&q.u?`<span class="muted">${q.u}</span>`:""}<button class="btn" type="submit">Responder</button></form><div id="fb"></div>`;
}
function bindQuestion(q, onAnswer){
  const done = ok => { cuiudo(ok?"ok":"bad"); onAnswer(ok, rightText(q)); };
  if(q.t==="mc"){
    app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const ok = +b.dataset.i===q.a;
      app.querySelectorAll(".opt").forEach(x=>{ x.disabled = true; if(+x.dataset.i===q.a) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong"); done(ok);
    }));
    return;
  }
  if(q.t==="ord"){
    const pool = document.getElementById("ordPool"), pickEl = document.getElementById("ordPick"), okB = document.getElementById("ordOk"), undo = document.getElementById("ordUndo");
    const seq = [];
    const draw = ()=>{ pickEl.innerHTML = seq.map(i=>`<li>${q.o[i]}</li>`).join(""); okB.disabled = seq.length!==q.o.length;
      pool.querySelectorAll("button").forEach(b=>b.disabled = seq.includes(+b.dataset.i)); };
    pool.addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b || b.disabled) return; seq.push(+b.dataset.i); draw(); });
    undo.onclick = ()=>{ seq.pop(); draw(); };
    okB.onclick = ()=>{ const ok = seq.every((v,i)=>v===i);
      pickEl.querySelectorAll("li").forEach((li,i)=>li.classList.add(seq[i]===i?"right":"wrong"));
      okB.disabled = true; undo.hidden = true; pool.querySelectorAll("button").forEach(b=>b.disabled = true); done(ok); };
    return;
  }
  const f = document.getElementById("numForm"), inp = document.getElementById("numIn");
  timers.push(setTimeout(()=>inp.focus(), 50));
  f.addEventListener("submit", e=>{ e.preventDefault();
    let ok;
    if(q.t==="num"){ const v = parseNum(inp.value);
      if(isNaN(v)){ inp.setCustomValidity("Digite um número, como 4,7 ou 4700."); inp.reportValidity(); inp.setCustomValidity(""); return; }
      ok = Math.abs(v - q.n) <= q.tol + 1e-9;
    } else { if(!inp.value.trim()){ inp.setCustomValidity("Escreva sua resposta."); inp.reportValidity(); inp.setCustomValidity(""); return; }
      ok = txtOk(inp.value, q.ac); }
    inp.disabled = true; f.querySelector("button").disabled = true; done(ok);
  });
}
const guidePage = q => q.g || GUIDE[q.id];
const feedback = (ok, right, q) => `<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Certo.":"Errado. Resposta: "+right}</b>${q.x}${!ok && guidePage(q)?`<div><button class="guidebtn" type="button" data-guide="${guidePage(q)}">Ver no guia, página ${guidePage(q)}</button></div>`:""}</div>`;
function tally(d, st, ok){ d.stats = d.stats || {}; d.stats[st] = d.stats[st] || {n:0, ok:0}; d.stats[st].n++; if(ok) d.stats[st].ok++; d.respondidas++; if(ok) d.acertos++; }

/* ---------------- Treino progressivo ---------------- */
let tr = null;
function seenMap(){ local.seen2 = local.seen2 || {}; local.seen2[me] = local.seen2[me] || {}; return local.seen2[me]; }
const statics = st => Q.filter(q=>q.s===st && !q.c);
/* Escolhe a próxima questão: 40% contas com números sorteados, 60% questões fixas ainda não vistas por esta pessoa */
function draw(st, level, avoid, lastGen){
  const gens = GEN.filter(g=>g.s===st && g!==lastGen);
  if(gens.length && Math.random() < 0.4){
    const near = gens.filter(g=>g.l===level); const g = pick(near.length ? near : gens);
    return Object.assign({s:st, l:g.l, g:g.g, id:null, gen:g}, g.f());
  }
  const seen = seenMap(), all = statics(st), free = q => !seen[q.id] && !avoid.includes(q.id);
  let pool = all.filter(q=>free(q) && q.l===level);
  if(!pool.length) pool = all.filter(q=>free(q) && Math.abs(q.l-level)<=1);
  if(!pool.length) pool = all.filter(free);
  if(!pool.length){ all.forEach(q=>delete seen[q.id]); saveLocal(); pool = all.filter(q=>!avoid.includes(q.id)); }
  return pick(pool);
}
function nextQuestion(){
  const st = pick(PEOPLE[me].capt);
  const q = draw(st, tr.diff, tr.used, tr.lastGen);
  if(q.id) tr.used.push(q.id); tr.lastGen = q.gen || null; return q;
}
function startTrain(){
  const d = prog();
  tr = {i:0, results:[], diff:d.nivel, streak:0, used:[], gained:0, startLevel:d.nivel};
  showTrain();
}
function showTrain(){
  clearAll();
  const q = nextQuestion(); tr.q = q;
  const d = prog();
  app.innerHTML = topBar() + `
  <div class="hud"><div class="dots" aria-label="Progresso da rodada">${Array.from({length:ROUND},(_,i)=>`<i class="${i<tr.results.length?(tr.results[i]?"ok":"bad"):i===tr.i?"now":""}"></i>`).join("")}</div>
    <div class="row"><span class="lvl muted">DIFICULDADE ${LV[tr.diff].toUpperCase()}</span><span class="pts">${d.pontos} pts</span></div></div>
  <section class="panel">${questionHTML(q)}</section>`;
  bindTop();
  bindQuestion(q, (ok, right)=>{
    const d = prog(), was = tr.diff;
    let gain = 0;
    if(ok){ tr.streak++; gain = 10*q.l + (tr.streak>=3?5:0); d.pontos += gain; tr.gained += gain;
      if(tr.streak>=2 && tr.diff<3){ tr.diff++; tr.streak = 0; } }
    else { tr.streak = 0; if(tr.diff>1) tr.diff--; }
    d.nivel = tr.diff; tally(d, q.s, ok); if(q.id) seenMap()[q.id] = true; setProg(me, d);
    tr.results.push(ok);
    if(tr.diff>was) setTimeout(()=>cuiudo("up"), 2000);
    const msg = tr.diff>was ? "Subiu para "+LV[tr.diff] : tr.diff<was ? "Desceu para "+LV[tr.diff] : "";
    document.getElementById("fb").innerHTML = feedback(ok, right, q) + `<div class="row" style="margin-top:14px">
      <button class="btn" id="next" type="button">${tr.i+1<ROUND?"Próxima":"Fechar rodada"}</button>
      ${gain?`<span class="toast">+${gain} pts</span>`:""}${msg?`<span class="lvl muted">${msg.toUpperCase()}</span>`:""}</div>`;
    const nx = document.getElementById("next"); nx.focus();
    nx.onclick = ()=>{ tr.i++; tr.i<ROUND ? showTrain() : endTrain(); };
  });
}
function endTrain(){
  clearAll();
  const ok = tr.results.filter(Boolean).length, d = prog();
  app.innerHTML = topBar() + `<section class="panel stack">
    <div class="eyebrow">Rodada concluída</div>
    <div class="big">${ok}/${ROUND}</div>
    <p class="muted">+${tr.gained} pontos. Dificuldade ${tr.startLevel===d.nivel?"mantida em "+LV[d.nivel]:LV[tr.startLevel]+" → "+LV[d.nivel]}.</p>
    <div class="row"><button class="btn" id="again" type="button">Próxima rodada</button><button class="btn ghost" id="back" type="button">Ver placar</button></div>
  </section>`;
  bindTop();
  document.getElementById("again").onclick = startTrain;
  document.getElementById("back").onclick = renderHome;
}

/* ---------------- Simulado ---------------- */
let sim = null;
function renderBriefing(){
  clearAll();
  app.innerHTML = topBar() + `<section class="panel stack">
    <div class="eyebrow">Briefing das 8h00 · em frente ao banner da JIEPE</div>
    <h3 style="font-size:26px">Regras do circuito</h3>
    <ul class="rules">
      <li>Você passa pelas suas estações (${PEOPLE[me].capt.length}), em ordem definida pelas dicas. As quatro salas aparecem como opção; uma sala errada custa 1 minuto de caminhada.</li>
      <li>Na entrada de cada estação, o monitor diz se o celular está liberado ou guardado. Liberado: só o líder usa.</li>
      <li>Duas perguntas por estação. Pode consultar o material de bancada da sala.</li>
      <li>Errou: 5 minutos de retenção na estação, contados no relógio.</li>
      <li>Inteligência artificial é proibida durante toda a prova.</li>
      <li>Vence o menor tempo total.</li>
    </ul>
    <p class="note">A dificuldade acompanha seu nível de treino (${LV[prog().nivel]}). Nas estações com celular, uma das perguntas é de consulta: exige pesquisar.</p>
    <div><button class="btn" id="go" type="button">Largar</button></div>
  </section>`;
  bindTop();
  document.getElementById("go").onclick = startSim;
}
function startSim(){
  const order = shuffle(PEOPLE[me].capt);
  const phones = order.length >= 2 ? shuffle([true,false].concat(order.slice(2).map(()=>Math.random()<.5))) : [Math.random()<.5];
  sim = {order, phone:{}, idx:0, start:Date.now(), pen:0, log:order.map(s=>({s, in:null, out:null, err:0, room:0})), lvl:prog().nivel};
  order.forEach((s,i)=>sim.phone[s] = phones[i]);
  showClue();
}
const now = () => Date.now() - sim.start + sim.pen;
function simShell(inner){
  clearAll();
  app.innerHTML = topBar() + `
  <div class="clock"><div><div class="eyebrow" style="color:inherit;opacity:.7">Tempo de prova</div><div class="t" id="clk">${fmt(now())}</div></div>
    <div class="pen" id="pen">${penText()}</div></div>
  <div class="track" style="grid-template-columns:repeat(${sim.order.length},1fr)">${sim.order.map((s,i)=>{ const shown = i<sim.idx || (i===sim.idx && sim.inRoom);
    return `<div class="${i<sim.idx?"done":shown?"now":""}" style="${i<sim.idx?`background:${col(s)};border-color:${col(s)}`:""}">${shown?ST[s].name.split(" ")[0]:"?"}</div>`; }).join("")}</div>
  <section class="panel stack" id="stage">${inner}</section>
  <div class="row" style="margin-top:12px"><button class="linkbtn" id="quit" type="button">Abandonar simulado</button></div>`;
  bindTop();
  document.getElementById("quit").onclick = renderHome;
  timers.push(setInterval(()=>{ const c = document.getElementById("clk"); if(c) c.textContent = fmt(now()); }, 250));
}
const penText = () => sim.pen ? `inclui +${fmt(sim.pen)} de penalidade` : "sem penalidades";
function showClue(){
  sim.inRoom = false;
  const target = sim.order[sim.idx];
  const left = STATIONS.filter(s=>!sim.order.slice(0,sim.idx).includes(s));
  simShell(`<div class="eyebrow">Dica ${sim.idx+1} de ${sim.order.length} · para qual sala vocês vão?</div>
    <div class="clue">${pick(CLUES[target])}</div>
    <div class="rooms">${shuffle(left).map(s=>`<button class="room" type="button" data-s="${s}" style="color:${col(s)}">${ST[s].name}</button>`).join("")}</div>
    <div id="roomMsg" class="note" aria-live="polite">Sala errada custa 1 minuto.</div>`);
  app.querySelectorAll(".room").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.s===target){ sim.log[sim.idx].in = now(); enterStation(); }
    else { sim.pen += 60000; sim.log[sim.idx].room++; b.disabled = true;
      document.getElementById("pen").textContent = penText();
      document.getElementById("roomMsg").textContent = "Sala errada: +1:00. Leiam a dica de novo."; }
  }));
}
function simQuestions(st){
  const L = sim.lvl;
  if(sim.phone[st]){
    const seen = seenMap(), cs = Q.filter(q=>q.s===st && q.c); const fresh = cs.filter(q=>!seen[q.id]);
    const c = pick(fresh.length ? fresh : cs);
    return [c, draw(st, 3, [c.id], null)];
  }
  const a = draw(st, L, [], null);
  return [a, draw(st, Math.min(3, L+1), a.id?[a.id]:[], a.gen||null)];
}
function enterStation(){
  const st = sim.order[sim.idx];
  sim.inRoom = true; sim.qs = simQuestions(st); sim.qi = 0;
  const on = sim.phone[st];
  simShell(`<div class="eyebrow" style="color:${col(st)}">Estação ${ST[st].name}</div>
    <h3 style="font-size:28px">O monitor avisa na porta:</h3>
    <div class="phone ${on?"on":"off"}">${on?PHONE_ON:PHONE_OFF}<span>${on?"Celular liberado nesta estação. Só o líder pode usar.":"Celular guardado nesta estação."}</span></div>
    <p class="note">${on?"Uma das perguntas exige consulta. Pesquisem sem IA: nada de resumos automáticos de buscador.":"Só vale a cabeça da equipe e o material de bancada."}</p>
    <div><button class="btn" id="go" type="button">Entrar na sala</button></div>`);
  document.getElementById("go").onclick = showSimQ;
}
function showSimQ(){
  const q = sim.qs[sim.qi], st = sim.order[sim.idx], on = sim.phone[st];
  simShell(`<div class="row" style="justify-content:space-between"><span class="eyebrow" style="color:${col(st)}">${ST[st].name} · pergunta ${sim.qi+1} de 2</span>
      <span class="lvl" style="color:var(${on?"--ok":"--bad"})">${on?"CELULAR LIBERADO":"CELULAR GUARDADO"}</span></div>
    <div>${questionHTML(q)}</div>
    <div><button class="linkbtn" id="benchBtn" type="button" aria-expanded="false">Ver material de bancada</button><div class="bench" id="bench" hidden>${BENCH[st]}</div></div>`);
  const bb = document.getElementById("benchBtn");
  bb.onclick = ()=>{ const b = document.getElementById("bench"); b.hidden = !b.hidden; bb.setAttribute("aria-expanded", !b.hidden); bb.textContent = b.hidden ? "Ver material de bancada" : "Esconder material de bancada"; };
  bindQuestion(q, (ok, right)=>{
    const d = prog(); tally(d, q.s, ok); if(q.id) seenMap()[q.id] = true; setProg(me, d);
    const fb = document.getElementById("fb");
    if(ok){
      fb.innerHTML = feedback(true, right, q) + `<div class="row" style="margin-top:14px"><button class="btn" id="next" type="button">${sim.qi===0?"Próxima pergunta":"Sair da sala"}</button></div>`;
      const n = document.getElementById("next"); n.onclick = advance; n.focus();
    } else {
      sim.log[sim.idx].err++;
      const end = Date.now() + 300000;
      fb.innerHTML = feedback(false, right, q) + `<div class="hold"><div class="eyebrow">Retenção na estação</div><div class="t mono" id="hold">05:00</div>
        <p class="note" style="margin:6px auto 0">O relógio de prova continua correndo. Pular a espera soma o tempo que faltava.</p>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="next" type="button" disabled>Continuar</button><button class="btn ghost" id="skip" type="button">Pular espera</button></div></div>`;
      timers.push(setInterval(()=>{ const r = end - Date.now(), h = document.getElementById("hold"); if(!h) return;
        h.textContent = fmt(r); if(r<=0){ const n = document.getElementById("next"); n.disabled = false; document.getElementById("skip").hidden = true; } }, 250));
      document.getElementById("next").onclick = advance;
      document.getElementById("skip").onclick = ()=>{ sim.pen += Math.max(0, end - Date.now()); advance(); };
    }
  });
}
function advance(){
  if(sim.qi===0){ sim.qi = 1; showSimQ(); return; }
  sim.log[sim.idx].out = now(); sim.idx++;
  sim.idx<sim.order.length ? showClue() : endSim();
}
function endSim(){
  clearAll();
  const total = now(), d = prog();
  d.simulados = (d.simulados||0)+1; d.ultimoTempo = total;
  const best = d.melhorTempo==null || total < d.melhorTempo; if(best) d.melhorTempo = total;
  setProg(me, d);
  cuiudo("end");
  const errs = sim.log.reduce((a,x)=>a+x.err,0), rooms = sim.log.reduce((a,x)=>a+x.room,0);
  let prev = 0;
  app.innerHTML = topBar() + `<section class="panel stack">
    <div class="eyebrow">Chegada</div>
    <div class="big">${fmt(total)}</div>
    <p class="muted">${best?"Novo melhor tempo, já está no placar. ":""}${errs} erro${errs===1?"":"s"} e ${rooms} sala${rooms===1?"":"s"} errada${rooms===1?"":"s"}.</p>
    <div class="scroll"><table class="res"><thead><tr><th>Estação</th><th>Celular</th><th class="n">Até achar</th><th class="n">Na sala</th><th class="n">Erros</th></tr></thead><tbody>
      ${sim.log.map(x=>{ const a = x.in - prev, b = x.out - x.in; prev = x.out;
        return `<tr><td style="color:${col(x.s)};font-weight:600">${ST[x.s].name}</td><td>${sim.phone[x.s]?"liberado":"guardado"}</td><td class="n">${fmt(a)}</td><td class="n">${fmt(b)}</td><td class="n">${x.err}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="note">"Na sala" inclui a retenção. Um erro custa mais que um minuto inteiro de conferência.</p>
    <div class="row"><button class="btn" id="again" type="button">Novo simulado</button><button class="btn ghost" id="back" type="button">Ver placar</button></div>
  </section>`;
  bindTop();
  document.getElementById("again").onclick = renderBriefing;
  document.getElementById("back").onclick = renderHome;
}

/* ---------------- Conexão com o placar compartilhado ---------------- */
function startSupabase(){
  backend = "sb";
  const pull = async ()=>{
    try{
      const r = await fetch(SB_URL+"?select=pessoa,dados", {headers:{apikey:SB_KEY}, cache:"no-store"});
      if(!r.ok) throw 0;
      const next = {}; (await r.json()).forEach(x=>{ if(PEOPLE[x.pessoa] && x.dados) next[x.pessoa] = x.dados; });
      const changed = JSON.stringify(next) !== JSON.stringify(board);
      board = next; dbState = "live"; if(changed) refreshBoard();
    }catch(e){ dbState = "offline"; }
    updateSync();
  };
  pull(); setInterval(pull, 8000);
}
(async ()=>{
  if(!(window.claude && window.claude.use)){ startSupabase(); return; }
  const loadTimer = setTimeout(()=>{ if(dbState==="loading"){ dbState = "offline"; updateSync(); } }, 10000);
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db){ clearTimeout(loadTimer); dbState = "offline"; updateSync(); return; }
  backend = "claude";
  db.collection("placar").onSnapshot(snap=>{
    const next = {}; snap.docs.forEach(doc=>{ if(PEOPLE[doc.id] && doc.exists) next[doc.id] = doc.data(); });
    board = next;
    if(!snap.metadata.fromCache){ clearTimeout(loadTimer); if(dbState!=="readonly") dbState = "live"; }
    refreshBoard(); updateSync();
  }, err=>{ clearTimeout(loadTimer); dbState = "offline"; updateSync(); });
})();

me ? renderHome() : renderEntry();
</script>

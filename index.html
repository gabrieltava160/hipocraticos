<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hipocráticos no Circuito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: caderno de bancada quadriculado; cada estação é uma cor de etiqueta de amostra; o cronômetro e o placar são os objetos centrais. */
:root{
  --bg:#EEF2F0; --grid:#DDE4E1; --paper:#FAFCFB; --ink:#16212A; --muted:#5B6B70; --line:#C9D3D0;
  --bertha:#7B3F8C; --sonja:#1E5AA8; --apgar:#C2413B; --johanna:#2E7D4F; --enigma:#9A6A12;
  --ok:#1F7A4A; --okbg:#E3F3EA; --bad:#B42D2D; --badbg:#FBE7E5; --gold:#B7791F;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1518; --grid:#18211F; --paper:#151D20; --ink:#E5ECEA; --muted:#93A3A6; --line:#2A3639;
  --bertha:#C08AD1; --sonja:#7FAEEB; --apgar:#EE8A83; --johanna:#7CC79B; --enigma:#E2B45A;
  --ok:#7CD3A1; --okbg:#173327; --bad:#F29A92; --badbg:#3A1C1A; --gold:#E9B65C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1518; --grid:#18211F; --paper:#151D20; --ink:#E5ECEA; --muted:#93A3A6; --line:#2A3639;
  --bertha:#C08AD1; --sonja:#7FAEEB; --apgar:#EE8A83; --johanna:#7CC79B; --enigma:#E2B45A;
  --ok:#7CD3A1; --okbg:#173327; --bad:#F29A92; --badbg:#3A1C1A; --gold:#E9B65C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sonja);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);max-width:65ch}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}

/* Entrada */
.hero{display:grid;gap:16px;padding-block:20px 4px}
.hero h1{font-size:clamp(44px,10vw,92px);font-weight:800;letter-spacing:-.03em}
.tubes{display:flex;gap:6px;height:10px}
.tubes span{flex:1;border-radius:3px}
.count{display:flex;gap:18px;flex-wrap:wrap;align-items:end}
.count div{display:grid}
.count b{font-family:var(--mono);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:10px;transition:border-color .15s,transform .15s}
.person:hover{border-color:var(--ink);transform:translateY(-2px)}
.person h3{font-size:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1.5px solid currentColor;line-height:1.4}
.chip.fill{color:var(--paper)!important;border-color:transparent}

/* Topo */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top .who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.top h2{font-size:28px}

/* Home */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mode{display:grid;gap:10px;align-content:start}
.mode h3{font-size:26px}
.lvlbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lvlbar span{height:8px;border-radius:2px;background:var(--grid)}
.lvlbar span.on{background:var(--ink)}

/* Placar */
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.board td{padding:10px 8px;border-bottom:1px solid var(--line)}
.board td.n,.board th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.board tr.me td{background:var(--grid)}
.pos{font-family:var(--mono);font-weight:700;width:2.2em}
.pos.p1{color:var(--gold)}
.scroll{overflow-x:auto}
.stations{display:grid;gap:8px;margin-top:6px}
.srow{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.sync{font-size:12px;color:var(--muted)}

/* Questão */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.qtext{font-size:18px;font-weight:500;line-height:1.5;max-width:65ch}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.numrow input{font-family:var(--mono);font-size:18px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:min(220px,100%)}
.numrow input.txtin{font-family:var(--body);width:min(360px,100%)}
.ordpool{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ordpool button{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 12px;font-weight:600;text-align:left}
.ordpool button:hover:not(:disabled){border-color:var(--ink)}
.ordpool button:disabled{opacity:.3}
.ordpick{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;counter-reset:o}
.ordpick li{counter-increment:o;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;background:var(--grid);font-weight:600}
.ordpick li::before{content:counter(o);font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.4em}
.ordpick li.right{background:var(--okbg);color:var(--ok)} .ordpick li.wrong{background:var(--badbg);color:var(--bad)}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.fb{margin-top:16px;padding:14px 16px;border-radius:6px;border-left:4px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb b{display:block;margin-bottom:4px}
.lvl{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hud .pts{font-family:var(--mono);font-size:22px;font-weight:700}
.toast{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ok)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--grid);display:block}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.now{background:var(--ink)}

/* Simulado */
.clock{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding:18px 20px;background:var(--ink);color:var(--paper);border-radius:8px;margin-bottom:14px}
.clock .t{font-family:var(--mono);font-size:clamp(40px,9vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.clock .pen{font-family:var(--mono);font-size:14px;opacity:.85}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.track div{height:30px;border-radius:5px;border:1.5px dashed var(--line);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 4px;text-align:center;overflow:hidden}
.track div.done{border-style:solid;color:var(--paper)}
.track div.now{border-style:solid;border-color:var(--ink);color:var(--ink)}
.clue{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.2}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.room{border:2px solid currentColor;background:var(--paper);border-radius:6px;padding:14px;font-weight:700;text-align:left}
.room:disabled{opacity:.35;text-decoration:line-through}
.phone{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:6px;border:2px solid;font-weight:700}
.phone.on{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.phone.off{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.phone svg{flex:none}
.bench{border:1.5px dashed var(--line);border-radius:6px;padding:14px;font-size:14px}
.bench table{border-collapse:collapse;font-size:13px}
.bench td,.bench th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.hold{text-align:center;padding:24px 16px}
.hold .t{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--bad)}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td,table.res th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.res .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:clamp(48px,12vw,80px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
ul.rules{margin:0;padding-left:1.2em;display:grid;gap:6px}
.guidebtn{margin-top:10px;border:1.5px solid var(--bad);background:var(--paper);color:var(--bad);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,18,.72);display:flex;justify-content:center;overflow-y:auto;
  padding-top:calc(16px + env(safe-area-inset-top, 0px));padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px))}
.modal .sheet{background:var(--paper);border-radius:8px;max-width:820px;width:100%;align-self:flex-start;overflow:hidden}
.modal .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.modal img{display:block;width:100%;height:auto;background:#fff}
.modal a{color:var(--sonja);font-weight:600}
.bordao{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(20px) rotate(-2deg);opacity:0;pointer-events:none;z-index:50;
  font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,34px);line-height:1.1;padding:14px 22px;border-radius:8px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-width:calc(100% - 32px);text-align:center;transition:opacity .2s,transform .25s}
.bordao{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 10px 14px!important}
.bordao img{display:block;width:clamp(140px,40vw,190px);height:auto;aspect-ratio:9/16;object-fit:cover;max-width:100%;border-radius:4px;border:2px solid var(--ink)}
.bordao.ok{background:var(--okbg);color:var(--ok)}
.bordao.bad{background:var(--badbg);color:var(--bad)}
.bordao.show{opacity:1;transform:translateX(-50%) translateY(0) rotate(-2deg)}
.bordao small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.sound{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
@media (max-width:520px){ .srow{grid-template-columns:84px 1fr 56px} .track div{font-size:9px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
<meta name="description" content="Treino da equipe Hipocráticos para o Circuito Ciência Delas · 12ª JIEPE UFTM">
</head>
<body>

<main class="wrap" id="app"></main>
<div class="bordao" id="bordao" role="status" aria-live="polite"></div>
<div class="modal" id="guideModal" hidden role="dialog" aria-modal="true" aria-label="Trecho do guia"><div class="sheet">
  <div class="bar2"><b id="guideTitle">Guia</b><div class="row"><a id="guidePdf" href="guia.pdf" target="_blank" rel="noopener">Abrir o PDF nesta página</a><button class="btn" id="guideClose" type="button">Fechar</button></div></div>
  <img id="guideImg" alt="Página do guia de preparação">
</div></div>

<script>
/* ---------------- Dados fixos ---------------- */
const ST = {
  bertha:{name:"Bertha Lutz", c:"--bertha"},
  sonja:{name:"Sonja Ashauer", c:"--sonja"},
  apgar:{name:"Virginia Apgar", c:"--apgar"},
  johanna:{name:"Johanna Döbereiner", c:"--johanna"},
  enigma:{name:"Enigmas", c:"--enigma"}
};
const STATIONS = ["bertha","sonja","apgar","johanna"];
const PEOPLE = {
  gabriel:{name:"Gabriel", capt:["sonja","apgar"], res:[]},
  xororo:{name:"Xororó", capt:["bertha"], res:["apgar","johanna"]},
  zelele:{name:"Zélelé", capt:["johanna"], res:["bertha","sonja"]}
};
const LV = {1:"Fácil",2:"Médio",3:"Difícil"};
const ROUND = 8;

/* ================= Banco de questões =================
   Tipos:
   txt  resposta escrita: ac = respostas aceitas (a primeira é a exibida)
   num  resposta numérica: n = valor, tol = tolerância absoluta, u = unidade
   mc   múltipla escolha: o = opções, a = índice certo
   ord  ordenar: o = itens já na ordem correta (a tela embaralha)
   c:1  questão de consulta (só nas estações com celular liberado do simulado)
   g    página do guia em PDF que explica o conteúdo
*/
const Q = [
/* ---------------- BERTHA LUTZ ---------------- */
{s:"bertha",l:1,g:8,t:"ord",q:"Monte a linha do tempo de Bertha:",o:["Funda a FBPF","Código Eleitoral garante o voto feminino","Bertha assume como deputada federal","Estado Novo fecha o Congresso","Carta da ONU com igualdade de gênero"],x:"1922 → 1932 → 1936 → 1937 → 1945."},
{s:"bertha",l:1,g:9,t:"txt",q:"Na classificação de T. H. Marshall (direitos civis, políticos e sociais), votar e ser votada é um direito…",ac:["político","políticos","direito político"],x:"Políticos: participar do poder. Civis são liberdades individuais; sociais são educação, saúde, trabalho."},
{s:"bertha",l:1,g:9,t:"txt",q:"Educação pública, atendimento no SUS e aposentadoria: que tipo de direito são, na classificação de Marshall?",ac:["sociais","social","direitos sociais"],x:"Direitos sociais. A sequência clássica de Marshall: civis → políticos → sociais."},
{s:"bertha",l:1,g:9,t:"txt",q:"Uma regra diz: «só vota quem sabe ler e escrever». Que tipo de sufrágio é esse?",ac:["capacitário","capacitario","sufrágio capacitário"],x:"Capacitário (depende de instrução). No Brasil, analfabetos só votaram a partir de 1985. Se dependesse de renda, seria censitário."},
{s:"bertha",l:1,g:9,t:"txt",q:"Outra regra: «só vota quem tem renda mínima». E esse sufrágio?",ac:["censitário","censitario","sufrágio censitário"],x:"Censitário. O contrário dos dois é o sufrágio universal."},
{s:"bertha",l:1,g:9,t:"num",q:"Destes cargos, quantos são eleitos pelo sistema proporcional? Presidente, senador, deputado estadual, prefeito, vereador, governador.",n:2,tol:0,u:"",x:"Só deputado estadual e vereador. Os outros quatro são majoritários."},
{s:"bertha",l:1,g:21,t:"txt",q:"Decifre (César, +3): YRWR VHFUHWR",ac:["voto secreto"],x:"Voltando 3 letras: VOTO SECRETO, outra novidade do Código Eleitoral de 1932."},
{s:"bertha",l:1,g:8,t:"txt",q:"Que instituição, criada pelo Código Eleitoral de 1932, organiza e fiscaliza as eleições até hoje?",ac:["Justiça Eleitoral","TSE","Tribunal Superior Eleitoral"],x:"A Justiça Eleitoral, criada no mesmo código que trouxe o voto feminino e o voto secreto."},
{s:"bertha",l:1,g:21,t:"num",q:"Cadeado em romanos: MCMXXXII. Qual o número?",n:1932,tol:0,u:"",x:"M (1000) + CM (900) + XXX (30) + II (2) = 1932, o ano do voto feminino."},
{s:"bertha",l:1,g:9,t:"txt",q:"Vereadora A teve mais votos que o vereador B, mas B se elegeu e A não. Isso só é possível no sistema majoritário ou no proporcional?",ac:["proporcional","sistema proporcional"],x:"No proporcional as vagas vão primeiro para os partidos, conforme a votação de cada um. Um candidato bem votado de partido fraco pode ficar de fora."},
{s:"bertha",l:1,g:8,t:"txt",q:"Bertha entrou por concurso numa instituição científica do Rio em 1919, uma das primeiras mulheres no serviço público federal. Qual?",ac:["Museu Nacional"],x:"Museu Nacional, onde trabalhou como bióloga, estudando anfíbios."},

{s:"bertha",l:2,g:9,t:"mc",q:"Por que se diz que o voto feminino de 1932 ainda não era igual ao masculino?",o:["Para as mulheres o voto era facultativo; para os homens, obrigatório","Só mulheres casadas podiam votar","Mulheres votavam, mas não podiam ser votadas","Só valia para eleições municipais"],a:0,x:"Votavam e podiam ser votadas, mas o voto feminino não era obrigatório. A obrigatoriedade igual veio com o Código Eleitoral de 1965."},
{s:"bertha",l:2,g:9,t:"txt",q:"Na Carta da ONU, a «igualdade de direito dos homens e das mulheres» aparece antes de todos os artigos. Como se chama essa parte de abertura?",ac:["preâmbulo","preambulo"],x:"Preâmbulo. Nos artigos, o 8 trata da igualdade de acesso aos órgãos da ONU."},
{s:"bertha",l:2,g:9,t:"mc",q:"Em São Francisco (1945), por que a delegação britânica resistia à menção explícita da igualdade de gênero?",o:["Achava desnecessário citar","Era contra o voto feminino","Queria só a igualdade salarial","Preferia deixar para a OIT"],a:0,x:"Argumentavam que já estava implícito. Bertha e as latino-americanas insistiram e venceram."},
{s:"bertha",l:2,g:9,t:"ord",q:"Ordene pelo ano em que as mulheres conquistaram o voto em nível nacional:",o:["Nova Zelândia","Finlândia","Estados Unidos","Brasil","França","Suíça"],x:"1893 · 1906 · 1920 · 1932 · 1944 · 1971."},
{s:"bertha",l:2,g:9,t:"mc",q:"Qual afirmação é FALSA?",o:["A França aprovou o voto feminino antes do Brasil","A Nova Zelândia foi pioneira, em 1893","Brasil e Uruguai aprovaram em 1932","A Suíça só aprovou no plano federal em 1971"],a:0,x:"A França só aprovou em 1944, doze anos depois do Brasil."},
{s:"bertha",l:2,g:8,t:"num",q:"Maria nasceu em 1922. Entre 1937 e 1945 o Estado Novo não fez eleições. Em que ano ela votou pela primeira vez numa eleição nacional?",n:1945,tol:0,u:"",x:"Ela fez 18 anos em 1940, já no Estado Novo. As eleições de 1933 e 1934 vieram cedo demais para ela; a primeira possível foi em dezembro de 1945."},
{s:"bertha",l:2,g:10,t:"num",q:"Mulheres são cerca de 52% do eleitorado. Se a Câmara (513 cadeiras) espelhasse o eleitorado, quantas deputadas teria? (arredonde)",n:267,tol:1,u:"deputadas",x:"0,52 × 513 ≈ 266,8 → 267. Em 2022 foram eleitas 91."},
{s:"bertha",l:2,g:10,t:"num",q:"Um partido registrou 8 homens e 2 mulheres para vereador. Sem retirar ninguém, quantas mulheres precisa acrescentar, no mínimo, para cumprir a cota de 30%?",n:2,tol:0,u:"",x:"Com +1: 11 vagas, mínimo ⌈3,3⌉ = 4 mulheres, e só teria 3. Com +2: 12 vagas, mínimo ⌈3,6⌉ = 4, e tem 4. Os homens ficam em 67%, dentro do teto de 70%."},
{s:"bertha",l:2,g:21,t:"txt",q:"Morse: ·—·· ··— — ——··",ac:["lutz"],x:"·—·· L · ··— U · — T · ——·· Z = LUTZ."},
{s:"bertha",l:2,g:9,t:"txt",q:"O voto feminino de 1932 veio por decreto, com o Congresso fechado desde 1930. Como se chama o período de Vargas entre 1930 e 1934?",ac:["Governo Provisório","Provisório"],x:"Governo Provisório. Depois vieram o Governo Constitucional (1934–1937) e o Estado Novo (1937–1945)."},
{s:"bertha",l:2,g:21,t:"txt",q:"Cadeado de 4 dígitos: os dois primeiros são o número do ODS da igualdade de gênero (com zero à esquerda); os dois últimos, a idade mínima para votar pelo Código de 1932.",ac:["0521"],x:"ODS 5 → 05; idade mínima de 21 anos → 21. Código: 0521."},
{s:"bertha",l:2,g:8,t:"txt",q:"Que regime de Vargas fechou o Congresso e a FBPF em novembro de 1937, interrompendo o mandato de Bertha?",ac:["Estado Novo"],x:"O Estado Novo (1937–1945)."},
{s:"bertha",l:2,g:8,t:"txt",q:"O pai de Bertha dá nome a um famoso instituto de saúde pública de São Paulo. Quem era ele?",ac:["Adolpho Lutz","Adolfo Lutz"],x:"Adolpho Lutz, pioneiro da medicina tropical. A mãe, Amy Fowler, era enfermeira inglesa."},

{s:"bertha",l:3,g:9,t:"num",q:"Cidade com 150 mil eleitores. Na eleição para prefeito, a candidata mais votada teve 48% dos votos válidos. Quantos turnos essa eleição terá?",n:1,tol:0,u:"turno",x:"Pegadinha: o 2º turno só existe em cidades com mais de 200 mil eleitores. Abaixo disso vence quem tiver mais votos."},
{s:"bertha",l:3,g:9,t:"num",q:"Agora a cidade tem 250 mil eleitores e a candidata teve exatamente 50% dos votos válidos. Quantos turnos?",n:2,tol:0,u:"turnos",x:"Maioria absoluta é MAIS de 50%. Exatos 50% não bastam: haverá 2º turno."},
{s:"bertha",l:3,g:21,t:"num",q:"Cadeado: (ano do Código Eleitoral) − (ano de fundação da FBPF) + (ano da Carta da ONU) − (ano em que Bertha assumiu como deputada).",n:19,tol:0,u:"",x:"1932 − 1922 + 1945 − 1936 = 10 + 9 = 19."},
{s:"bertha",l:3,g:21,t:"txt",q:"Chave desconhecida! Decifre: KJIJWFHFT. Dica: tem a ver com o que Bertha fundou em 1922.",ac:["federação","federacao"],x:"César com chave 5: K→F, J→E, I→D… = FEDERACAO (Federação Brasileira pelo Progresso Feminino)."},
{s:"bertha",l:3,g:10,t:"num",q:"QE = 6.444 votos. O partido X teve 19.500 votos. Quantos votos a mais X precisaria para ganhar uma 4ª vaga direto pelo quociente partidário?",n:6276,tol:0,u:"votos",x:"Hoje: 19.500 ÷ 6.444 = 3,03 → 3 vagas. Para 4: 4 × 6.444 = 25.776. Faltam 25.776 − 19.500 = 6.276."},
{s:"bertha",l:3,g:10,t:"num",q:"Em 2022 foram eleitas 91 deputadas, de 513. Quantas a MAIS seriam necessárias para a Câmara refletir os 52% de mulheres no eleitorado?",n:176,tol:1,u:"",x:"0,52 × 513 ≈ 267; 267 − 91 = 176."},
{s:"bertha",l:3,g:9,t:"ord",q:"Ordene do sufrágio mais restrito ao mais amplo, no Brasil:",o:["Só homens alfabetizados com 21+","Homens e mulheres alfabetizados com 21+ (1932)","Homens e mulheres alfabetizados com 18+ (1934)","Analfabetos também votam (1985)","Facultativo a partir dos 16 anos (1988)"],x:"Cada etapa ampliou o eleitorado: mulheres (1932), 18 anos (1934), analfabetos (1985), 16 anos (1988)."},
{s:"bertha",l:3,g:9,t:"mc",q:"Uma deputada propõe: «metade das cadeiras reservada a mulheres». Isso é diferente da regra atual porque a regra atual…",o:["reserva candidaturas, não cadeiras","reserva 30% das cadeiras","não existe cota alguma","vale só para o Senado"],a:0,x:"A cota brasileira é de candidaturas (mín. 30% de cada sexo) e de recursos (EC 117/2022), não de cadeiras."},

{s:"bertha",l:2,g:9,c:1,t:"num",q:"Consulte: quantos países assinaram a Carta da ONU como membros originais?",n:51,tol:0,u:"",x:"51 membros originais (50 em São Francisco e a Polônia, que assinou depois). O Brasil é um deles."},
{s:"bertha",l:2,g:8,c:1,t:"txt",q:"Consulte: quem foi a primeira mulher eleita deputada federal no Brasil, em 1933?",ac:["Carlota Pereira de Queirós","Carlota Pereira de Queiroz","Carlota de Queirós","Carlota"],x:"Carlota Pereira de Queirós (SP), na Constituinte de 1933."},
{s:"bertha",l:2,g:10,c:1,t:"txt",q:"Consulte: qual o número da lei de igualdade salarial entre mulheres e homens, de 2023? (número/ano)",ac:["14.611/2023","14611/2023","14611","14.611"],x:"Lei 14.611/2023, citada por Lula na ONU ao homenagear Bertha."},
{s:"bertha",l:3,g:9,c:1,t:"txt",q:"Consulte: além de Bertha, quem foram as outras signatárias da Carta da ONU? Escreva o nome da representante da República Dominicana.",ac:["Minerva Bernardino","Minerva"],x:"Minerva Bernardino. As outras: Virginia Gildersleeve (EUA) e Wu Yi-fang (China)."},
{s:"bertha",l:3,g:8,c:1,t:"txt",q:"Consulte: em que cidade estrangeira foi a conferência da ONU de 1975, último compromisso público de Bertha?",ac:["Cidade do México","México","Mexico"],x:"Cidade do México, na Conferência Mundial do Ano Internacional da Mulher."},

/* ---------------- SONJA ASHAUER ---------------- */
{s:"sonja",l:1,g:13,t:"txt",q:"Um míope enxerga mal de longe. Que tipo de lente corrige?",ac:["divergente","lente divergente"],x:"Divergente: a imagem se formava antes da retina. Hipermetropia e presbiopia pedem convergente."},
{s:"sonja",l:1,g:12,t:"txt",q:"Na fibra óptica a luz viaja presa dentro do vidro por causa de qual fenômeno?",ac:["reflexão interna total","reflexão total","reflexao total","reflexao interna total"],x:"Reflexão interna total: a luz bate na parede com ângulo acima do limite e não sai."},
{s:"sonja",l:1,g:13,t:"txt",q:"Para medir a tensão num resistor, o voltímetro é ligado em série ou em paralelo com ele?",ac:["paralelo","em paralelo"],x:"Paralelo. O amperímetro é que vai em série, abrindo o circuito."},
{s:"sonja",l:1,g:13,t:"txt",q:"Entre vermelho e violeta, qual cor tem fótons de maior energia?",ac:["violeta"],x:"Violeta: menor comprimento de onda, maior energia (E = hc/λ)."},
{s:"sonja",l:1,g:12,t:"txt",q:"Que partícula, a «antimatéria do elétron», foi prevista pela equação do orientador de Sonja e detectada em 1932?",ac:["pósitron","positron","positrão"],x:"O pósitron, previsto por Dirac e detectado por Carl Anderson."},
{s:"sonja",l:1,g:13,t:"txt",q:"Uma lupa (objeto entre o foco e a lente) forma imagem real ou virtual?",ac:["virtual"],x:"Virtual, direita e maior. Por isso você a vê pela lente e não consegue projetá-la."},
{s:"sonja",l:1,g:12,t:"txt",q:"Por que um canudo parece quebrado dentro de um copo d'água? Nome do fenômeno.",ac:["refração","refracao"],x:"Refração: a luz muda de velocidade e de direção ao passar da água para o ar."},
{s:"sonja",l:1,g:12,t:"num",q:"Espelho côncavo com raio de curvatura de 40 cm. Distância focal, em cm?",n:20,tol:0,u:"cm",x:"f = R/2 = 20 cm."},
{s:"sonja",l:1,g:13,t:"num",q:"Três resistores de 30 Ω ligados em paralelo. Resistência equivalente?",n:10,tol:0,u:"Ω",x:"Iguais em paralelo: R/n = 30/3 = 10 Ω."},
{s:"sonja",l:1,g:13,t:"ord",q:"Ordene pelo comprimento de onda, do menor para o maior:",o:["raios gama","raios X","ultravioleta","luz visível","infravermelho","micro-ondas","ondas de rádio"],x:"Do mais energético ao menos energético: γ, X, UV, visível, IV, micro-ondas, rádio."},
{s:"sonja",l:1,g:21,t:"txt",q:"Decifre (César, +3): GLUDF",ac:["dirac"],x:"G→D, L→I, U→R, D→A, F→C: DIRAC, o orientador de Sonja em Cambridge."},
{s:"sonja",l:1,g:12,t:"num",q:"Sonja nasceu em 1923. Quantos anos ela tinha quando Dirac publicou sua equação do elétron (1928)?",n:5,tol:0,u:"anos",x:"1928 − 1923 = 5. Vinte anos depois ela seria doutora orientada por ele."},

{s:"sonja",l:2,g:13,t:"num",q:"Um LED vermelho funciona com 2 V e 20 mA. Ligado a uma bateria de 9 V, que resistor deve ir em série com ele?",n:350,tol:0,u:"Ω",x:"O resistor fica com 9 − 2 = 7 V. R = 7 ÷ 0,020 = 350 Ω."},
{s:"sonja",l:2,g:12,t:"num",q:"Olhando quase na vertical, o fundo de uma piscina parece estar a 1,5 m. Qual a profundidade real? (n da água = 1,33)",n:2,tol:0.05,u:"m",x:"Profundidade real ≈ aparente × n = 1,5 × 1,33 ≈ 2,0 m. Por isso piscinas parecem mais rasas."},
{s:"sonja",l:2,g:13,t:"txt",q:"Dois polarizadores com eixos a 90° entre si. Passa luz?",ac:["não","nao","nenhuma","zero","0"],x:"Não: cos² 90° = 0. Guarde isso para a próxima pergunta, que surpreende."},
{s:"sonja",l:2,g:13,t:"num",q:"CD como rede de difração: trilhas a 1,6 µm, laser de 650 nm. Qual a maior ordem de difração possível?",n:2,tol:0,u:"",x:"m < d/λ = 1600/650 = 2,46 → ordem 2."},
{s:"sonja",l:2,g:12,t:"txt",q:"A tese de Sonja foi sobre elétrons e radiação eletromagnética. Qual a sigla em inglês da teoria quântica da interação entre luz e cargas?",ac:["QED"],x:"QED, Quantum Electrodynamics (eletrodinâmica quântica)."},
{s:"sonja",l:2,g:13,t:"num",q:"Lente convergente de f = 10 cm, objeto a 30 cm. Qual o aumento linear (com sinal)?",n:-0.5,tol:0.01,u:"",x:"1/p' = 1/10 − 1/30 → p' = 15 cm. A = −15/30 = −0,5: real, invertida e com metade do tamanho."},
{s:"sonja",l:2,g:13,t:"txt",q:"No sensor de uma câmera, a imagem formada pela lente é como? (real ou virtual; direita ou invertida)",ac:["real e invertida","real invertida","invertida e real"],x:"Real e invertida, menor que o objeto (objeto além de 2f)."},
{s:"sonja",l:2,g:13,t:"num",q:"Transformador: 220 V no primário (2.000 espiras) e 11 V no secundário. Quantas espiras tem o secundário?",n:100,tol:0,u:"espiras",x:"U₁/U₂ = N₁/N₂ → N₂ = 2000 × 11/220 = 100."},
{s:"sonja",l:2,g:14,t:"num",q:"Vai medir um resistor de 4,7 kΩ. As escalas do ohmímetro são 200 Ω, 2 k, 20 k e 200 k. Qual a melhor escala, em kΩ?",n:20,tol:0,u:"kΩ",x:"A menor escala que ainda comporta o valor: 20 k (2 k estoura)."},
{s:"sonja",l:2,g:13,t:"num",q:"Um chuveiro de 5.500 W fica ligado 15 min por dia durante 30 dias. Quantos kWh consome?",n:41.25,tol:0.1,u:"kWh",x:"5,5 kW × 0,25 h × 30 = 41,25 kWh."},
{s:"sonja",l:2,g:13,t:"ord",q:"Ordene as cores do visível pela energia do fóton, da menor para a maior:",o:["vermelho","laranja","amarelo","verde","azul","violeta"],x:"Energia cresce quando o comprimento de onda diminui (≈700 nm no vermelho até ≈400 nm no violeta)."},
{s:"sonja",l:2,g:21,t:"txt",q:"Morse: ——— ·——· — ·· —·—· ·—",ac:["optica","óptica"],x:"O P T I C A = ÓPTICA, uma das áreas que Sonja pesquisou."},

{s:"sonja",l:3,g:13,t:"num",q:"Entre dois polarizadores cruzados (90°) coloca-se um terceiro a 45°. Que porcentagem da luz natural inicial sai no final?",n:12.5,tol:0.2,u:"%",x:"½ no 1º; × cos² 45° = ½ no do meio; × cos² 45° = ½ no último: 1/8 = 12,5%. Pôr um filtro a MAIS deixa luz passar!"},
{s:"sonja",l:3,g:13,t:"num",q:"Esse mesmo chuveiro (41,25 kWh/mês) com tarifa de R$ 0,80 por kWh: quanto custa por mês, em reais?",n:33,tol:0.1,u:"R$",x:"41,25 × 0,80 = R$ 33,00."},
{s:"sonja",l:3,g:13,t:"num",q:"12 V alimentam R1 = 100 Ω em série com dois resistores de 300 Ω em paralelo entre si. Qual a tensão em R1?",n:4.8,tol:0.05,u:"V",x:"Paralelo: 150 Ω. Total 250 Ω → i = 48 mA. U₁ = 100 × 0,048 = 4,8 V."},
{s:"sonja",l:3,g:13,t:"num",q:"Ângulo de Brewster para luz do ar incidindo no vidro (n = 1,5), em graus:",n:56.3,tol:0.5,u:"°",x:"tan θB = 1,5 → θB ≈ 56,3°. Nesse ângulo a luz refletida sai totalmente polarizada (é assim que óculos polarizados cortam reflexos)."},
{s:"sonja",l:3,g:13,t:"num",q:"Transição do hidrogênio de n = 3 para n = 2 (série de Balmer). Comprimento de onda, em nm?",n:656,tol:3,u:"nm",x:"1/λ = R(1/4 − 1/9) = R·5/36 → λ ≈ 656 nm: a linha vermelha Hα."},
{s:"sonja",l:3,g:13,t:"num",q:"Um laser de 1 mW emite em 620 nm (fótons de 2 eV). Quantos fótons por segundo? Responda em unidades de 10¹⁵.",n:3.1,tol:0.1,u:"× 10¹⁵",x:"2 eV = 3,2 × 10⁻¹⁹ J. N = 10⁻³ ÷ 3,2 × 10⁻¹⁹ ≈ 3,1 × 10¹⁵ fótons/s."},
{s:"sonja",l:3,g:12,t:"txt",q:"A QED da época de Sonja dava resultados infinitos. Que técnica, do fim dos anos 1940 (Feynman, Schwinger, Tomonaga), resolveu isso?",ac:["renormalização","renormalizacao"],x:"Renormalização, que rendeu o Nobel de 1965."},
{s:"sonja",l:3,g:12,t:"mc",q:"Um raio de luz sai do diamante (n = 2,42) para o ar com 30° de incidência. O que acontece?",o:["Reflexão interna total","Refrata e se aproxima da normal","Refrata e se afasta da normal","Sai sem desviar"],a:0,x:"Ângulo limite do diamante: sen θc = 1/2,42 → θc ≈ 24,4°. Como 30° > 24,4°, reflete todo: é o brilho do diamante."},

{s:"sonja",l:2,g:12,c:1,t:"num",q:"Consulte: em que ano Paul Dirac recebeu o Nobel de Física?",n:1933,tol:0,u:"",x:"1933, dividido com Erwin Schrödinger."},
{s:"sonja",l:2,g:12,c:1,t:"txt",q:"Consulte: com quem Dirac dividiu o Nobel de 1933?",ac:["Schrödinger","Schrodinger","Erwin Schrödinger","Schroedinger"],x:"Erwin Schrödinger."},
{s:"sonja",l:3,g:12,c:1,t:"txt",q:"Consulte: qual o título (em inglês) da tese de doutorado de Sonja?",ac:["Problems on Electrons and Electromagnetic Radiation"],x:"Problems on Electrons and Electromagnetic Radiation (Cambridge, 1948)."},
{s:"sonja",l:2,g:12,c:1,t:"txt",q:"Consulte: com qual professor ítalo-ucraniano Sonja estudou física na USP?",ac:["Gleb Wataghin","Wataghin"],x:"Gleb Wataghin, de quem ela foi assistente ao voltar em 1948."},
{s:"sonja",l:3,g:12,c:1,t:"txt",q:"Consulte: de qual sociedade científica de Cambridge Sonja foi a primeira brasileira eleita membro?",ac:["Cambridge Philosophical Society","Philosophical Society"],x:"Cambridge Philosophical Society."},

/* ---------------- VIRGINIA APGAR ---------------- */
{s:"apgar",l:1,g:15,t:"num",q:"1º minuto: FC 130, choro forte, movimentação ativa, espirra quando estimulado, corpo rosado com mãos e pés azulados. Qual o Apgar?",n:9,tol:0,u:"",x:"2 + 2 + 2 + 2 + 1 (acrocianose) = 9."},
{s:"apgar",l:1,g:15,t:"txt",q:"Qual sinal do Apgar quase nunca recebe nota 2 no 1º minuto?",ac:["cor","cor da pele","aparência"],x:"A cor: a acrocianose é comum nos primeiros minutos. Por isso Apgar 10 no 1º minuto é raro."},
{s:"apgar",l:1,g:15,t:"txt",q:"Para a própria Virginia Apgar, qual sinal era o mais importante?",ac:["frequência cardíaca","frequencia cardiaca","FC","pulso","batimentos"],x:"A frequência cardíaca, para diagnóstico e prognóstico."},
{s:"apgar",l:1,g:15,t:"num",q:"A partir de que nota o Apgar é considerado tranquilizador?",n:7,tol:0,u:"",x:"7 a 10 tranquilizador; 4 a 6 moderadamente anormal; 0 a 3 baixo."},
{s:"apgar",l:1,g:16,t:"txt",q:"RN com 36 semanas e 6 dias: termo ou pré-termo?",ac:["pré-termo","pre termo","prematuro","pretermo"],x:"Pré-termo: termo começa em 37 semanas completas."},
{s:"apgar",l:1,g:15,t:"txt",q:"No acrônimo APGAR, o «P» vem de qual palavra em inglês?",ac:["pulse"],x:"Pulse (frequência cardíaca). Appearance, Pulse, Grimace, Activity, Respiration."},
{s:"apgar",l:1,g:16,t:"txt",q:"Teste do olhinho: que reflexo se procura?",ac:["reflexo vermelho","vermelho"],x:"O reflexo vermelho. Ausente ou branco sugere catarata congênita ou retinoblastoma."},
{s:"apgar",l:1,g:16,t:"ord",q:"Ordene pelo momento em que são feitos:",o:["Apgar do 1º minuto","Apgar do 5º minuto","Teste do coraçãozinho","Teste do pezinho"],x:"1 min → 5 min → coraçãozinho (24 a 48 h) → pezinho (3º ao 5º dia)."},
{s:"apgar",l:1,g:21,t:"txt",q:"Decifre (César, +3): DSJDU",ac:["apgar"],x:"D→A, S→P, J→G, D→A, U→R."},
{s:"apgar",l:1,g:16,t:"num",q:"Até que porcentagem do peso de nascimento a perda nos primeiros dias é considerada fisiológica?",n:10,tol:0,u:"%",x:"Até cerca de 10%, recuperada em 10 a 14 dias."},
{s:"apgar",l:1,g:16,t:"txt",q:"Que teste, feito com gotas de sangue do calcanhar, detecta fenilcetonúria e hipotireoidismo congênito?",ac:["teste do pezinho","pezinho"],x:"Teste do pezinho, idealmente entre o 3º e o 5º dia de vida."},

{s:"apgar",l:2,g:15,t:"num",q:"5º minuto: FC 90, respiração fraca e irregular, alguma flexão dos membros, careta ao aspirar, corpo rosado e extremidades azuis. Qual o Apgar?",n:5,tol:0,u:"",x:"1 + 1 + 1 + 1 + 1 = 5: moderadamente anormal."},
{s:"apgar",l:2,g:15,t:"txt",q:"RN a termo, não respira e está hipotônico. Após os passos iniciais, a FC continua < 100. Qual o próximo passo?",ac:["ventilação com pressão positiva","ventilação","ventilar","VPP","VPP com balão"],x:"Ventilação com pressão positiva. Massagem só se a FC seguir < 60 depois de ventilação adequada."},
{s:"apgar",l:2,g:15,t:"num",q:"Na massagem cardíaca neonatal, quantas compressões para cada ventilação?",n:3,tol:0,u:"",x:"3 : 1 (90 compressões e 30 ventilações por minuto)."},
{s:"apgar",l:2,g:15,t:"txt",q:"Se o bebê precisar de reanimação, ela começa antes ou depois do Apgar de 1 minuto?",ac:["antes"],x:"Antes: é o «minuto de ouro». O Apgar descreve a resposta, não decide começar."},
{s:"apgar",l:2,g:16,t:"txt",q:"Um teste de triagem gera muitos falsos positivos. Qual medida dele está baixa: sensibilidade ou especificidade?",ac:["especificidade"],x:"Especificidade = VN/(VN + FP): muitos FP derrubam a especificidade."},
{s:"apgar",l:2,g:16,t:"txt",q:"Na triagem neonatal o pior erro é deixar escapar um doente. Que medida se prioriza?",ac:["sensibilidade"],x:"Sensibilidade. Depois, todo positivo é confirmado por outro exame."},
{s:"apgar",l:2,g:15,t:"mc",q:"Segundo Virginia Apgar, quem deveria dar a nota?",o:["Alguém que não fez o parto","O obstetra que fez o parto","A mãe","O pediatra no dia seguinte"],a:0,x:"Alguém que não fez o parto, para ser objetivo."},
{s:"apgar",l:2,g:15,t:"num",q:"Um RN está sem batimentos e flácido; os outros três sinais não foram anotados. Qual o MAIOR Apgar possível?",n:6,tol:0,u:"",x:"FC 0 e tônus 0; os outros três no máximo 2 cada: 6."},
{s:"apgar",l:2,g:17,t:"num",q:"Ao todo, quantas combinações diferentes de notas existem no Apgar (5 sinais, notas 0 a 2)?",n:243,tol:0,u:"",x:"3⁵ = 243."},
{s:"apgar",l:2,g:17,t:"num",q:"Município: 2.400 nascidos vivos e 30 óbitos de menores de 1 ano, 18 deles nos primeiros 27 dias. Qual a taxa de mortalidade neonatal, por mil?",n:7.5,tol:0.1,u:"‰",x:"18 ÷ 2.400 × 1.000 = 7,5 por mil nascidos vivos. Neonatal = 0 a 27 dias."},
{s:"apgar",l:2,g:16,t:"txt",q:"Teste do coraçãozinho: em qual membro se mede a saturação pré-ductal?",ac:["membro superior direito","mão direita","braço direito","MSD"],x:"Membro superior direito, que recebe sangue antes do canal arterial. O outro ponto é um membro inferior."},

let writeTimer = null, writing = Promise.resolve(), pendingDoc = null;
function remoteSet(p, data){
  if(backend==="sb") return fetch(SB_URL+"?on_conflict=pessoa", {method:"POST",
    headers:{apikey:SB_KEY, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"},
    body: JSON.stringify({pessoa:p, dados:data, atualizado:new Date().toISOString()})}).then(r=>{ if(!r.ok) throw {code:"http"}; });
  return db.doc("placar/"+p).set(data);
}
function queueWrite(p, data){
  if(!backend) return;
  pendingDoc = {p, data: JSON.parse(JSON.stringify(data))};
  clearTimeout(writeTimer);
  writeTimer = setTimeout(()=>{ const job = pendingDoc; pendingDoc = null; if(!job) return;
    writing = writing.then(()=>remoteSet(job.p, job.data)).catch(e=>{ dbState = e && e.code==="invalid_argument" ? "readonly" : dbState; updateSync(); }); }, 1200);
}

  return (h ? h+":"+String(m).padStart(2,"0") : String(m).padStart(2,"0")) + ":" + String(x).padStart(2,"0"); };
function parseNum(str){
  let s = String(str).trim().replace(/\s/g,"").replace(/[%°]/g,"");

let soundOn = local.sound !== false, actx = null;
function ac(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){ actx = null; } return actx; }
function tone(freqs, dur, type, vol, delay){
  const c = ac(); if(!c) return; const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = type; f.type = "lowpass"; f.frequency.value = 1800;
  o.frequency.setValueAtTime(freqs[0], t0);
  for(let i=1;i<freqs.length;i++) o.frequency.linearRampToValueAtTime(freqs[i], t0 + dur*i/(freqs.length-1));
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+0.04); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
}

const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, d=>"₀₁₂₃₄₅₆₇₈₉".indexOf(d)).replace(/[^a-z0-9]+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function txtOk(ans, ac){ const a = norm(ans); if(!a) return false; const a2 = a.replace(/ /g,"");
  return ac.some(x=>{ const b = norm(x), b2 = b.replace(/ /g,"");
    if(a2===b2) return true;
    if(b2.length>=4 && (" "+a+" ").includes(" "+b+" ")) return true;
    const tol = b2.length>=10?2:b2.length>=5?1:0; return tol>0 && lev(a2,b2)<=tol; }); }
const HINT = {txt:"ESCREVA A RESPOSTA", num:"DIGITE O NÚMERO", mc:"ESCOLHA UMA", ord:"TOQUE NA ORDEM CERTA"};
function rightText(q){ return q.t==="mc" ? q.o[q.a] : q.t==="txt" ? q.ac[0] : q.t==="ord" ? q.o.join(" → ") : fmtNum(q.n) + (q.u?` ${q.u}`:""); }

function tally(d, st, ok){ d.stats = d.stats || {}; d.stats[st] = d.stats[st] || {n:0, ok:0}; d.stats[st].n++; if(ok) d.stats[st].ok++; d.respondidas++; if(ok) d.acertos++; }

/* ---------------- Treino progressivo ---------------- */
let tr = null;
function seenMap(){ local.seen3 = local.seen3 || {}; local.seen3[me] = local.seen3[me] || {}; return local.seen3[me]; }
const statics = st => Q.filter(q=>q.s===st && !q.c);
/* Escolhe a próxima questão: 25% contas com números sorteados (só nos níveis 2 e 3), 75% questões fixas ainda não vistas por esta pessoa */
function draw(st, level, avoid, lastGen){
  const gens = GEN.filter(g=>g.s===st && g!==lastGen);
  if(gens.length && level>=2 && Math.random() < 0.25){
    const near = gens.filter(g=>g.l===level); const g = pick(near.length ? near : gens);
    return Object.assign({s:st, l:g.l, g:g.g, id:null, gen:g}, g.f());
  }
  const seen = seenMap(), all = statics(st), free = q => !seen[q.id] && !avoid.includes(q.id);
  let pool = all.filter(q=>free(q) && q.l===level);
  if(!pool.length) pool = all.filter(q=>free(q) && Math.abs(q.l-level)<=1);
  if(!pool.length) pool = all.filter(free);
  if(!pool.length){ all.forEach(q=>delete seen[q.id]); saveLocal(); pool = all.filter(q=>!avoid.includes(q.id)); }
  return pick(pool);
}
function nextQuestion(){
  const st = pick(PEOPLE[me].capt);
  const q = draw(st, tr.diff, tr.used, tr.lastGen);
  if(q.id) tr.used.push(q.id); tr.lastGen = q.gen || null; return q;
}
function startTrain(){
  const d = prog();
  tr = {i:0, results:[], diff:d.nivel, streak:0, used:[], gained:0, startLevel:d.nivel};
  showTrain();
}
function showTrain(){
  clearAll();
  const q = nextQuestion(); tr.q = q;
  const d = prog();
  app.innerHTML = topBar() + `
  <div class="hud"><div class="dots" aria-label="Progresso da rodada">${Array.from({length:ROUND},(_,i)=>`<i class="${i<tr.results.length?(tr.results[i]?"ok":"bad"):i===tr.i?"now":""}"></i>`).join("")}</div>
    <div class="row"><span class="lvl muted">DIFICULDADE ${LV[tr.diff].toUpperCase()}</span><span class="pts">${d.pontos} pts</span></div></div>
  <section class="panel">${questionHTML(q)}</section>`;
  bindTop();
  bindQuestion(q, (ok, right)=>{
    const d = prog(), was = tr.diff;
    let gain = 0;
    if(ok){ tr.streak++; gain = 10*q.l + (tr.streak>=3?5:0); d.pontos += gain; tr.gained += gain;
      if(tr.streak>=2 && tr.diff<3){ tr.diff++; tr.streak = 0; } }
    else { tr.streak = 0; if(tr.diff>1) tr.diff--; }
    d.nivel = tr.diff; tally(d, q.s, ok); if(q.id) seenMap()[q.id] = true; setProg(me, d);
    tr.results.push(ok);
    if(tr.diff>was) setTimeout(()=>cuiudo("up"), 2000);
    const msg = tr.diff>was ? "Subiu para "+LV[tr.diff] : tr.diff<was ? "Desceu para "+LV[tr.diff] : "";
    document.getElementById("fb").innerHTML = feedback(ok, right, q) + `<div class="row" style="margin-top:14px">
      <button class="btn" id="next" type="button">${tr.i+1<ROUND?"Próxima":"Fechar rodada"}</button>
      ${gain?`<span class="toast">+${gain} pts</span>`:""}${msg?`<span class="lvl muted">${msg.toUpperCase()}</span>`:""}</div>`;
    const nx = document.getElementById("next"); nx.focus();
    nx.onclick = ()=>{ tr.i++; tr.i<ROUND ? showTrain() : endTrain(); };
  });
}
function endTrain(){
  clearAll();
  const ok = tr.results.filter(Boolean).length, d = prog();
  app.innerHTML = topBar() + `<section class="panel stack">
    <div class="eyebrow">Rodada concluída</div>
    <div class="big">${ok}/${ROUND}</div>
    <p class="muted">+${tr.gained} pontos. Dificuldade ${tr.startLevel===d.nivel?"mantida em "+LV[d.nivel]:LV[tr.startLevel]+" → "+LV[d.nivel]}.</p>
    <div class="row"><button class="btn" id="again" type="button">Próxima rodada</button><button class="btn ghost" id="back" type="button">Ver placar</button></div>
  </section>`;
  bindTop();
  document.getElementById("again").onclick = startTrain;
  document.getElementById("back").onclick = renderHome;
}

/* ---------------- Simulado ---------------- */
let sim = null;
function renderBriefing(){
  clearAll();
  app.innerHTML = topBar() + `<section class="panel stack">
    <div class="eyebrow">Briefing das 8h00 · em frente ao banner da JIEPE</div>
    <h3 style="font-size:26px">Regras do circuito</h3>
    <ul class="rules">
      <li>São ${VISITS} salas seguidas, todas das suas estações (${PEOPLE[me].capt.map(s=>ST[s].name).join(" e ")}), na ordem das dicas. As quatro salas aparecem como opção; sala errada custa 1 minuto de caminhada.</li>
      <li>Na entrada de cada estação, o monitor diz se o celular está liberado ou guardado. Liberado: só o líder usa.</li>
      <li>Duas perguntas por estação. Pode consultar o material de bancada da sala.</li>
      <li>Errou: 5 minutos de retenção na estação, contados no relógio.</li>
      <li>Inteligência artificial é proibida durante toda a prova.</li>
      <li>Vence o menor tempo total.</li>
    </ul>
    <p class="note">${VISITS*2} perguntas no total. Começa no seu nível de treino (${LV[prog().nivel]}) e endurece a cada duas salas. Com celular liberado, uma das perguntas é de consulta: exige pesquisar.</p>
    <div><button class="btn" id="go" type="button">Largar</button></div>
  </section>`;
  bindTop();
  document.getElementById("go").onclick = startSim;
}
const VISITS = 6;
function startSim(){
  /* 6 passagens pelas estações de capitão, sem repetir a mesma sala duas vezes seguidas quando há mais de uma */
  const capt = PEOPLE[me].capt, order = [];
  while(order.length < VISITS){ const opts = capt.length>1 ? capt.filter(s=>s!==order[order.length-1]) : capt; order.push(pick(opts)); }
  const phones = shuffle(order.map((s,i)=>i%2===0));
  sim = {order, phones, idx:0, used:[], start:Date.now(), pen:0, log:order.map(s=>({s, in:null, out:null, err:0, room:0})), lvl:prog().nivel};
  showClue();
}
const phoneOn = () => sim.phones[sim.idx];
const now = () => Date.now() - sim.start + sim.pen;
function simShell(inner){
  clearAll();
  app.innerHTML = topBar() + `
  <div class="clock"><div><div class="eyebrow" style="color:inherit;opacity:.7">Tempo de prova</div><div class="t" id="clk">${fmt(now())}</div></div>
    <div class="pen" id="pen">${penText()}</div></div>
  <div class="track" style="grid-template-columns:repeat(${sim.order.length},1fr)">${sim.order.map((s,i)=>{ const shown = i<sim.idx || (i===sim.idx && sim.inRoom);
    return `<div class="${i<sim.idx?"done":shown?"now":""}" style="${i<sim.idx?`background:${col(s)};border-color:${col(s)}`:""}">${shown?ST[s].name.split(" ")[0]:i+1}</div>`; }).join("")}</div>
  <section class="panel stack" id="stage">${inner}</section>
  <div class="row" style="margin-top:12px"><button class="linkbtn" id="quit" type="button">Abandonar simulado</button></div>`;
  bindTop();
  document.getElementById("quit").onclick = renderHome;
  timers.push(setInterval(()=>{ const c = document.getElementById("clk"); if(c) c.textContent = fmt(now()); }, 250));
}
const penText = () => sim.pen ? `inclui +${fmt(sim.pen)} de penalidade` : "sem penalidades";
function showClue(){
  sim.inRoom = false;
  const target = sim.order[sim.idx];
  simShell(`<div class="eyebrow">Dica ${sim.idx+1} de ${sim.order.length} · para qual sala vocês vão?</div>
    <div class="clue">${pick(CLUES[target])}</div>
    <div class="rooms">${shuffle(STATIONS).map(s=>`<button class="room" type="button" data-s="${s}" style="color:${col(s)}">${ST[s].name}</button>`).join("")}</div>
    <div id="roomMsg" class="note" aria-live="polite">Sala errada custa 1 minuto.</div>`);
  app.querySelectorAll(".room").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.s===target){ sim.log[sim.idx].in = now(); enterStation(); }
    else { sim.pen += 60000; sim.log[sim.idx].room++; b.disabled = true;
      document.getElementById("pen").textContent = penText();
      document.getElementById("roomMsg").textContent = "Sala errada: +1:00. Leiam a dica de novo."; }
  }));
}
function simQuestions(st){
  /* nível sobe ao longo do percurso: começa no nível do treino e chega a Difícil nas últimas salas */
  const L = Math.min(3, sim.lvl + Math.floor(sim.idx/2)), used = sim.used;
  const take = q => { if(q.id) used.push(q.id); return q; };
  if(phoneOn()){
    const seen = seenMap(), cs = Q.filter(q=>q.s===st && q.c && !used.includes(q.id)); const fresh = cs.filter(q=>!seen[q.id]);
    const c = cs.length ? take(pick(fresh.length ? fresh : cs)) : null;
    const b = take(draw(st, Math.max(2, L), used, null));
    return c ? [c, b] : [take(draw(st, L, used, null)), b];
  }
  const a = take(draw(st, L, used, null));
  return [a, take(draw(st, Math.min(3, L+1), used, a.gen||null))];
}
function enterStation(){
  const st = sim.order[sim.idx];
  sim.inRoom = true; sim.qs = simQuestions(st); sim.qi = 0;
  const on = phoneOn();
  simShell(`<div class="eyebrow" style="color:${col(st)}">Sala ${sim.idx+1} de ${sim.order.length} · Estação ${ST[st].name}</div>
    <h3 style="font-size:28px">O monitor avisa na porta:</h3>
    <div class="phone ${on?"on":"off"}">${on?PHONE_ON:PHONE_OFF}<span>${on?"Celular liberado nesta estação. Só o líder pode usar.":"Celular guardado nesta estação."}</span></div>
    <p class="note">${on?"Uma das perguntas exige consulta. Pesquisem sem IA: nada de resumos automáticos de buscador.":"Só vale a cabeça da equipe e o material de bancada."}</p>
    <div><button class="btn" id="go" type="button">Entrar na sala</button></div>`);
  document.getElementById("go").onclick = showSimQ;
}
function showSimQ(){
  const q = sim.qs[sim.qi], st = sim.order[sim.idx], on = phoneOn();
  simShell(`<div class="row" style="justify-content:space-between"><span class="eyebrow" style="color:${col(st)}">${ST[st].name} · pergunta ${sim.qi+1} de 2</span>
      <span class="lvl" style="color:var(${on?"--ok":"--bad"})">${on?"CELULAR LIBERADO":"CELULAR GUARDADO"}</span></div>
    <div>${questionHTML(q)}</div>
    <div><button class="linkbtn" id="benchBtn" type="button" aria-expanded="false">Ver material de bancada</button><div class="bench" id="bench" hidden>${BENCH[st]}</div></div>`);
  const bb = document.getElementById("benchBtn");
  bb.onclick = ()=>{ const b = document.getElementById("bench"); b.hidden = !b.hidden; bb.setAttribute("aria-expanded", !b.hidden); bb.textContent = b.hidden ? "Ver material de bancada" : "Esconder material de bancada"; };
  bindQuestion(q, (ok, right)=>{
    const d = prog(); tally(d, q.s, ok); if(q.id) seenMap()[q.id] = true; setProg(me, d);
    const fb = document.getElementById("fb");
    if(ok){
      fb.innerHTML = feedback(true, right, q) + `<div class="row" style="margin-top:14px"><button class="btn" id="next" type="button">${sim.qi===0?"Próxima pergunta":"Sair da sala"}</button></div>`;
      const n = document.getElementById("next"); n.onclick = advance; n.focus();
    } else {
      sim.log[sim.idx].err++;
      const end = Date.now() + 300000;
      fb.innerHTML = feedback(false, right, q) + `<div class="hold"><div class="eyebrow">Retenção na estação</div><div class="t mono" id="hold">05:00</div>
        <p class="note" style="margin:6px auto 0">O relógio de prova continua correndo. Pular a espera soma o tempo que faltava.</p>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="next" type="button" disabled>Continuar</button><button class="btn ghost" id="skip" type="button">Pular espera</button></div></div>`;
      timers.push(setInterval(()=>{ const r = end - Date.now(), h = document.getElementById("hold"); if(!h) return;
        h.textContent = fmt(r); if(r<=0){ const n = document.getElementById("next"); n.disabled = false; document.getElementById("skip").hidden = true; } }, 250));
      document.getElementById("next").onclick = advance;
      document.getElementById("skip").onclick = ()=>{ sim.pen += Math.max(0, end - Date.now()); advance(); };
    }
  });
}
function advance(){
  if(sim.qi===0){ sim.qi = 1; showSimQ(); return; }
  sim.log[sim.idx].out = now(); sim.idx++;
  sim.idx<sim.order.length ? showClue() : endSim();
}
function endSim(){
  clearAll();
  const total = now(), d = prog();
  d.simulados = (d.simulados||0)+1; d.ultimoTempo = total;
  const best = d.melhorTempo==null || total < d.melhorTempo; if(best) d.melhorTempo = total;
  setProg(me, d);
  cuiudo("end");
  const errs = sim.log.reduce((a,x)=>a+x.err,0), rooms = sim.log.reduce((a,x)=>a+x.room,0);
  let prev = 0;
  app.innerHTML = topBar() + `<section class="panel stack">
    <div class="eyebrow">Chegada</div>
    <div class="big">${fmt(total)}</div>
    <p class="muted">${best?"Novo melhor tempo, já está no placar. ":""}${errs} erro${errs===1?"":"s"} e ${rooms} sala${rooms===1?"":"s"} errada${rooms===1?"":"s"}.</p>
    <div class="scroll"><table class="res"><thead><tr><th>Estação</th><th>Celular</th><th class="n">Até achar</th><th class="n">Na sala</th><th class="n">Erros</th></tr></thead><tbody>
      ${sim.log.map((x,k)=>{ const a = x.in - prev, b = x.out - x.in; prev = x.out;
        return `<tr><td style="color:${col(x.s)};font-weight:600">${ST[x.s].name}</td><td>${sim.phones[k]?"liberado":"guardado"}</td><td class="n">${fmt(a)}</td><td class="n">${fmt(b)}</td><td class="n">${x.err}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="note">"Na sala" inclui a retenção. Um erro custa mais que um minuto inteiro de conferência.</p>
    <div class="row"><button class="btn" id="again" type="button">Novo simulado</button><button class="btn ghost" id="back" type="button">Ver placar</button></div>
  </section>`;
  bindTop();
  document.getElementById("again").onclick = renderBriefing;
  document.getElementById("back").onclick = renderHome;
}

/* ---------------- Conexão com o placar compartilhado ---------------- */
function startSupabase(){
  backend = "sb";
  const pull = async ()=>{
    try{
      const r = await fetch(SB_URL+"?select=pessoa,dados", {headers:{apikey:SB_KEY}, cache:"no-store"});
      if(!r.ok) throw 0;
      const next = {}; (await r.json()).forEach(x=>{ if(PEOPLE[x.pessoa] && x.dados) next[x.pessoa] = x.dados; });
      const changed = JSON.stringify(next) !== JSON.stringify(board);
      board = next; dbState = "live"; if(changed) refreshBoard();
    }catch(e){ dbState = "offline"; }
    updateSync();
  };
  pull(); setInterval(pull, 8000);
}
(async ()=>{
  if(!(window.claude && window.claude.use)){ startSupabase(); return; }
  const loadTimer = setTimeout(()=>{ if(dbState==="loading"){ dbState = "offline"; updateSync(); } }, 10000);
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db){ clearTimeout(loadTimer); dbState = "offline"; updateSync(); return; }
  backend = "claude";
  db.collection("placar").onSnapshot(snap=>{
    const next = {}; snap.docs.forEach(doc=>{ if(PEOPLE[doc.id] && doc.exists) next[doc.id] = doc.data(); });
    board = next;
    if(!snap.metadata.fromCache){ clearTimeout(loadTimer); if(dbState!=="readonly") dbState = "live"; }
    refreshBoard(); updateSync();
  }, err=>{ clearTimeout(loadTimer); dbState = "offline"; updateSync(); });
})();

me ? renderHome() : renderEntry();
</script>

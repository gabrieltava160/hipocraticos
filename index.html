<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hipocráticos no Circuito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: caderno de bancada quadriculado; cada estação é uma cor de etiqueta de amostra; o cronômetro e o placar são os objetos centrais. */
:root{
  --bg:#EEF2F0; --grid:#DDE4E1; --paper:#FAFCFB; --ink:#16212A; --muted:#5B6B70; --line:#C9D3D0;
  --bertha:#7B3F8C; --sonja:#1E5AA8; --apgar:#C2413B; --johanna:#2E7D4F; --enigma:#9A6A12;
  --ok:#1F7A4A; --okbg:#E3F3EA; --bad:#B42D2D; --badbg:#FBE7E5; --gold:#B7791F;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1518; --grid:#18211F; --paper:#151D20; --ink:#E5ECEA; --muted:#93A3A6; --line:#2A3639;
  --bertha:#C08AD1; --sonja:#7FAEEB; --apgar:#EE8A83; --johanna:#7CC79B; --enigma:#E2B45A;
  --ok:#7CD3A1; --okbg:#173327; --bad:#F29A92; --badbg:#3A1C1A; --gold:#E9B65C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1518; --grid:#18211F; --paper:#151D20; --ink:#E5ECEA; --muted:#93A3A6; --line:#2A3639;
  --bertha:#C08AD1; --sonja:#7FAEEB; --apgar:#EE8A83; --johanna:#7CC79B; --enigma:#E2B45A;
  --ok:#7CD3A1; --okbg:#173327; --bad:#F29A92; --badbg:#3A1C1A; --gold:#E9B65C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sonja);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);max-width:65ch}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}

/* Entrada */
.hero{display:grid;gap:16px;padding-block:20px 4px}
.hero h1{font-size:clamp(44px,10vw,92px);font-weight:800;letter-spacing:-.03em}
.tubes{display:flex;gap:6px;height:10px}
.tubes span{flex:1;border-radius:3px}
.count{display:flex;gap:18px;flex-wrap:wrap;align-items:end}
.count div{display:grid}
.count b{font-family:var(--mono);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:10px;transition:border-color .15s,transform .15s}
.person:hover{border-color:var(--ink);transform:translateY(-2px)}
.person h3{font-size:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1.5px solid currentColor;line-height:1.4}
.chip.fill{color:var(--paper)!important;border-color:transparent}

/* Topo */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top .who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.top h2{font-size:28px}

/* Home */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mode{display:grid;gap:10px;align-content:start}
.mode h3{font-size:26px}
.lvlbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lvlbar span{height:8px;border-radius:2px;background:var(--grid)}
.lvlbar span.on{background:var(--ink)}

/* Placar */
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.board td{padding:10px 8px;border-bottom:1px solid var(--line)}
.board td.n,.board th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.board tr.me td{background:var(--grid)}
.pos{font-family:var(--mono);font-weight:700;width:2.2em}
.pos.p1{color:var(--gold)}
.scroll{overflow-x:auto}
.stations{display:grid;gap:8px;margin-top:6px}
.srow{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.sync{font-size:12px;color:var(--muted)}

/* Questão */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.qtext{font-size:18px;font-weight:500;line-height:1.5;max-width:65ch}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.numrow input{font-family:var(--mono);font-size:18px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:min(220px,100%)}
.fb{margin-top:16px;padding:14px 16px;border-radius:6px;border-left:4px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb b{display:block;margin-bottom:4px}
.lvl{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hud .pts{font-family:var(--mono);font-size:22px;font-weight:700}
.toast{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ok)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--grid);display:block}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.now{background:var(--ink)}

/* Simulado */
.clock{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding:18px 20px;background:var(--ink);color:var(--paper);border-radius:8px;margin-bottom:14px}
.clock .t{font-family:var(--mono);font-size:clamp(40px,9vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.clock .pen{font-family:var(--mono);font-size:14px;opacity:.85}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.track div{height:30px;border-radius:5px;border:1.5px dashed var(--line);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 4px;text-align:center;overflow:hidden}
.track div.done{border-style:solid;color:var(--paper)}
.track div.now{border-style:solid;border-color:var(--ink);color:var(--ink)}
.clue{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.2}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.room{border:2px solid currentColor;background:var(--paper);border-radius:6px;padding:14px;font-weight:700;text-align:left}
.room:disabled{opacity:.35;text-decoration:line-through}
.phone{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:6px;border:2px solid;font-weight:700}
.phone.on{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.phone.off{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.phone svg{flex:none}
.bench{border:1.5px dashed var(--line);border-radius:6px;padding:14px;font-size:14px}
.bench table{border-collapse:collapse;font-size:13px}
.bench td,.bench th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.hold{text-align:center;padding:24px 16px}
.hold .t{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--bad)}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td,table.res th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.res .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:clamp(48px,12vw,80px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
ul.rules{margin:0;padding-left:1.2em;display:grid;gap:6px}
.bordao{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(20px) rotate(-2deg);opacity:0;pointer-events:none;z-index:50;
  font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,34px);line-height:1.1;padding:14px 22px;border-radius:8px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-width:calc(100% - 32px);text-align:center;transition:opacity .2s,transform .25s}
.bordao{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 10px 14px!important}
.bordao img{display:block;width:clamp(140px,40vw,190px);height:auto;aspect-ratio:9/16;object-fit:cover;max-width:100%;border-radius:4px;border:2px solid var(--ink)}
.bordao.ok{background:var(--okbg);color:var(--ok)}
.bordao.bad{background:var(--badbg);color:var(--bad)}
.bordao.show{opacity:1;transform:translateX(-50%) translateY(0) rotate(-2deg)}
.bordao small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.sound{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
@media (max-width:520px){ .srow{grid-template-columns:84px 1fr 56px} .track div{font-size:9px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
<meta name="description" content="Treino da equipe Hipocráticos para o Circuito Ciência Delas · 12ª JIEPE UFTM">
</head>
<body>

<main class="wrap" id="app"></main>
<div class="bordao" id="bordao" role="status" aria-live="polite"></div>

<script>
/* ---------------- Dados fixos ---------------- */
const ST = {
  bertha:{name:"Bertha Lutz", c:"--bertha"},
  sonja:{name:"Sonja Ashauer", c:"--sonja"},
  apgar:{name:"Virginia Apgar", c:"--apgar"},
  johanna:{name:"Johanna Döbereiner", c:"--johanna"},
  enigma:{name:"Enigmas", c:"--enigma"}
};
const STATIONS = ["bertha","sonja","apgar","johanna"];
const PEOPLE = {
  gabriel:{name:"Gabriel", capt:["sonja","apgar"], res:[]},
  xororo:{name:"Xororó", capt:["bertha"], res:["apgar","johanna"]},
  zelele:{name:"Zélelé", capt:["johanna"], res:["bertha","sonja"]}
};
const LV = {1:"Fácil",2:"Médio",3:"Difícil"};
const ROUND = 8;

/* Banco de questões.
   mc: {s,l,q,o:[...],a:índice correto,x}
   num: {s,l,q,n:resposta,t:tolerância absoluta,u:unidade,x} */
const Q = [
/* ---------- BERTHA LUTZ ---------- */
{s:"bertha",l:1,q:"Em que ano o Código Eleitoral garantiu às mulheres brasileiras o direito de votar e ser votadas?",o:["1922","1932","1934","1945"],a:1,x:"Decreto nº 21.076, de 24 de fevereiro de 1932, assinado por Getúlio Vargas no Governo Provisório."},
{s:"bertha",l:1,q:"Que organização Bertha Lutz fundou em 1922?",o:["Liga das Mulheres Eleitoras","Federação Brasileira pelo Progresso Feminino","Comissão sobre a Situação da Mulher","Associação Brasileira de Ciências"],a:1,x:"A FBPF, que ela presidiu por cerca de 20 anos, liderou a campanha pelo sufrágio. Lema: \"Ciência e Trabalho\"."},
{s:"bertha",l:1,q:"Em que instituição Bertha Lutz trabalhou como bióloga?",o:["Instituto Butantan","Fiocruz","Museu Nacional","Jardim Botânico de São Paulo"],a:2,x:"Entrou no Museu Nacional por concurso em 1919, uma das primeiras mulheres no serviço público federal."},
{s:"bertha",l:1,q:"Onde Bertha Lutz se formou em Ciências Naturais?",o:["Universidade de São Paulo","Sorbonne, em Paris","Universidade de Cambridge","Universidade de Munique"],a:1,x:"Formou-se na Sorbonne; depois cursou também Direito no Brasil."},
{s:"bertha",l:1,q:"Qual foi o primeiro país a garantir o voto feminino em nível nacional?",o:["Reino Unido","Estados Unidos","Nova Zelândia","Finlândia"],a:2,x:"Nova Zelândia, 1893. A Finlândia (1906) foi a primeira a permitir que mulheres também fossem eleitas ao parlamento."},
{s:"bertha",l:1,q:"Em 1945, Bertha ajudou a incluir a igualdade entre homens e mulheres em qual documento?",o:["Declaração Universal dos Direitos Humanos","Carta das Nações Unidas","Convenção CEDAW","Constituição de 1946"],a:1,x:"Na Conferência de São Francisco, como delegada do Brasil. A Declaração Universal é de 1948 e a CEDAW, de 1979."},
{s:"bertha",l:1,q:"Qual Objetivo de Desenvolvimento Sustentável trata da igualdade de gênero (e é o ODS da JIEPE 2026)?",o:["ODS 3","ODS 4","ODS 5","ODS 10"],a:2,x:"ODS 5 · Igualdade de Gênero."},
{s:"bertha",l:1,q:"Quem governava o Brasil quando o voto feminino foi instituído em 1932?",o:["Washington Luís","Getúlio Vargas","Eurico Dutra","Júlio Prestes"],a:1,x:"Getúlio Vargas, chefe do Governo Provisório após a Revolução de 1930."},
{s:"bertha",l:1,q:"O que caracteriza o sufrágio censitário?",o:["O voto depende da renda","O voto depende do sexo","O voto é secreto","O voto é obrigatório"],a:0,x:"Censitário: depende de renda ou propriedade. Capacitário: depende de instrução."},
{s:"bertha",l:2,q:"Quantas mulheres assinaram a Carta da ONU em 1945?",o:["Uma","Duas","Quatro","Doze"],a:2,x:"Bertha Lutz (Brasil), Minerva Bernardino (República Dominicana), Virginia Gildersleeve (EUA) e Wu Yi-fang (China)."},
{s:"bertha",l:2,q:"Qual artigo da Carta da ONU impede restrições à participação de homens e mulheres, em igualdade, nos órgãos da organização?",o:["Artigo 1","Artigo 2","Artigo 8","Artigo 51"],a:2,x:"Artigo 8. O Preâmbulo também cita a igualdade de direito dos homens e das mulheres."},
{s:"bertha",l:2,q:"Quem foi a primeira mulher eleita deputada federal no Brasil, em 1933?",o:["Bertha Lutz","Carlota Pereira de Queirós","Alzira Soriano","Antonieta de Barros"],a:1,x:"Carlota Pereira de Queirós (SP), eleita para a Constituinte. Bertha foi a segunda mulher a ocupar uma cadeira na Câmara."},
{s:"bertha",l:2,q:"Que estado aprovou, em 1927, uma lei permitindo o voto feminino?",o:["São Paulo","Minas Gerais","Rio Grande do Norte","Rio de Janeiro"],a:2,x:"No RN, Celina Guimarães Viana (Mossoró) se tornou a primeira eleitora do Brasil."},
{s:"bertha",l:2,q:"Em 1928, Alzira Soriano foi eleita prefeita de Lajes (RN). Qual o pioneirismo dela?",o:["Primeira senadora do Brasil","Primeira prefeita da América Latina","Primeira governadora do Brasil","Primeira ministra do STF"],a:1,x:"Primeira prefeita eleita da América Latina."},
{s:"bertha",l:2,q:"Por que Bertha Lutz assumiu como deputada federal em 1936?",o:["Foi a mais votada do Rio","Era suplente e o titular, Cândido Pessoa, morreu","Foi nomeada por Vargas","Venceu uma eleição suplementar"],a:1,x:"Eleita 1ª suplente em 1934, assumiu em julho de 1936 com a morte do titular."},
{s:"bertha",l:2,q:"O que encerrou o mandato de Bertha Lutz em 1937?",o:["Ela renunciou","O golpe do Estado Novo fechou o Congresso","Perdeu a reeleição","Foi cassada pelo STF"],a:1,x:"O Estado Novo (10/11/1937) fechou o Congresso e também a FBPF."},
{s:"bertha",l:2,q:"Qual foi a primeira Constituição brasileira a prever o voto feminino?",o:["1891","1934","1937","1946"],a:1,x:"A Constituição de 1934 incorporou o voto feminino conquistado em 1932 e baixou a idade mínima para 18 anos."},
{s:"bertha",l:2,q:"Qual a ordem cronológica correta do voto feminino nacional?",o:["Finlândia → EUA → Brasil → França","EUA → Finlândia → França → Brasil","Brasil → Finlândia → EUA → França","Finlândia → Brasil → EUA → França"],a:0,x:"Finlândia 1906, EUA 1920, Brasil 1932, França 1944."},
{s:"bertha",l:2,q:"Pela Lei 9.504/1997, qual a regra de cota de gênero nas candidaturas proporcionais?",o:["Mínimo de 20% de mulheres","Mínimo de 30% e máximo de 70% de cada sexo","Metade exata de cada sexo","Mínimo de 30% das cadeiras para mulheres"],a:1,x:"É cota de candidaturas, não de cadeiras: no mínimo 30% e no máximo 70% para cada sexo."},
{s:"bertha",l:2,q:"Qual é o número da Lei Maria da Penha?",o:["Lei 9.504/1997","Lei 11.340/2006","Lei 13.104/2015","Lei 14.192/2021"],a:1,x:"11.340/2006. A 13.104/2015 é a do feminicídio; a 14.192/2021 trata da violência política contra a mulher."},
{s:"bertha",l:2,q:"Na eleição de 1932, como era o voto para as mulheres?",o:["Obrigatório, como para os homens","Facultativo","Proibido para casadas","Permitido só a partir de 30 anos"],a:1,x:"O código de 1932 permitia que as mulheres votassem, mas sem obrigatoriedade. A igualdade plena de obrigatoriedade veio com o Código Eleitoral de 1965."},
{s:"bertha",l:3,q:"Uma cidade tem 15 vagas de vereador e 150.000 votos válidos. Qual é o quociente eleitoral?",n:10000,t:0,u:"votos",x:"QE = válidos ÷ vagas = 150.000 ÷ 15 = 10.000."},
{s:"bertha",l:3,q:"Com QE = 10.000, um partido recebeu 47.300 votos. Quantas vagas ele ganha diretamente pelo quociente partidário?",n:4,t:0,u:"vagas",x:"QP = 47.300 ÷ 10.000 = 4,73. Despreza-se a fração: 4 vagas diretas. A fração pode render vaga nas sobras."},
{s:"bertha",l:3,q:"Um partido lança 25 candidaturas a vereador. Qual o número mínimo de candidaturas de cada sexo?",n:8,t:0,u:"candidaturas",x:"30% de 25 = 7,5. O mínimo arredonda para cima: 8."},
{s:"bertha",l:3,q:"98.765 votos válidos, 9 vagas. Qual o quociente eleitoral (com a regra de arredondamento do Código Eleitoral)?",n:10974,t:0,u:"votos",x:"98.765 ÷ 9 = 10.973,89. Fração maior que 0,5 arredonda para cima: 10.974."},
{s:"bertha",l:3,q:"Depois do QP, os partidos têm: A 38.000 votos e 3 vagas; B 27.500 e 2; C 18.800 e 1; D 9.000 e 0. Quem leva a primeira vaga das sobras?",o:["A (média 9.500)","B (média 9.167)","C (média 9.400)","D (média 9.000)"],a:0,x:"Média = votos ÷ (vagas + 1). A 38.000/4 = 9.500 é a maior."},
{s:"bertha",l:3,q:"Método D'Hondt, 5 cadeiras. A = 10.000; B = 6.000; C = 2.800 votos. Quantas cadeiras fica o partido A?",n:3,t:0,u:"cadeiras",x:"Quocientes: A 10.000, 5.000, 3.333; B 6.000, 3.000; C 2.800. Os 5 maiores: 10.000(A), 6.000(B), 5.000(A), 3.333(A), 3.000(B). A = 3, B = 2."},
{s:"bertha",l:3,q:"Em 2022, as mulheres conquistaram cerca de que fatia da Câmara dos Deputados?",o:["Cerca de 8%","Cerca de 18%","Cerca de 35%","Cerca de 52%"],a:1,x:"91 de 513 (≈17,7%), embora sejam cerca de 52% do eleitorado."},
{s:"bertha",l:3,q:"Em que ano a ONU adotou a CEDAW (Convenção sobre a Eliminação de Todas as Formas de Discriminação contra a Mulher)?",o:["1945","1948","1975","1979"],a:3,x:"1979. Em 1975 foi o Ano Internacional da Mulher, cuja conferência (Cidade do México) foi o último evento público de Bertha."},
{s:"bertha",l:3,q:"Qual lei de 2021 tipifica a violência política contra a mulher?",o:["Lei 14.192/2021","Lei 14.154/2021","Lei 14.211/2021","Lei 14.611/2021"],a:0,x:"14.192/2021. A 14.154 é a do teste do pezinho; a 14.211 mexeu nas sobras eleitorais; a 14.611/2023 trata de igualdade salarial."},
{s:"bertha",l:3,q:"A Lei 14.611/2023, citada por Lula na ONU em homenagem a Bertha, trata de quê?",o:["Cota nas cadeiras do Congresso","Igualdade salarial entre mulheres e homens","Voto feminino obrigatório","Licença-maternidade de 6 meses"],a:1,x:"Igualdade salarial e de critérios remuneratórios entre mulheres e homens."},

/* ---------- SONJA ASHAUER ---------- */
{s:"sonja",l:1,q:"Quem orientou Sonja Ashauer no doutorado em Cambridge?",o:["Albert Einstein","Paul Dirac","Niels Bohr","Gleb Wataghin"],a:1,x:"Paul Dirac, Nobel de Física de 1933. Wataghin foi seu professor na USP."},
{s:"sonja",l:1,q:"Em que universidade Sonja se formou em física, em 1942?",o:["UFRJ","Unicamp","USP","UFMG"],a:2,x:"Universidade de São Paulo, aluna de Gleb Wataghin."},
{s:"sonja",l:1,q:"Com que idade Sonja Ashauer morreu, em 1948?",o:["22","25","31","40"],a:1,x:"Aos 25 anos, poucos meses depois de voltar ao Brasil."},
{s:"sonja",l:1,q:"Qual a definição do índice de refração de um meio?",o:["n = v/c","n = c/v","n = λ·f","n = sen θ"],a:1,x:"n = c/v. Quanto maior n, mais lenta a luz no meio."},
{s:"sonja",l:1,q:"Que lente corrige a miopia?",o:["Convergente","Divergente","Cilíndrica","Bifocal convergente"],a:1,x:"Divergente. Hipermetropia e presbiopia: convergente. Astigmatismo: cilíndrica."},
{s:"sonja",l:1,q:"Como se liga um voltímetro no circuito?",o:["Em série","Em paralelo","Com o circuito desligado","Entre o fio e a terra"],a:1,x:"Voltímetro em paralelo; amperímetro em série; ohmímetro com o circuito desligado."},
{s:"sonja",l:1,q:"Como se mede corrente com um amperímetro?",o:["Em paralelo com o resistor","Em série, abrindo o circuito","Com a fonte desligada","Encostando nos dois polos da fonte"],a:1,x:"Em série. Ligar um amperímetro em paralelo pode queimar o fusível do aparelho."},
{s:"sonja",l:1,q:"No espectro visível, qual cor tem o maior comprimento de onda?",o:["Violeta","Verde","Azul","Vermelho"],a:3,x:"Vermelho (≈700 nm). Violeta é o menor (≈400 nm)."},
{s:"sonja",l:1,q:"Qual antipartícula a equação de Dirac previu, detectada por Anderson em 1932?",o:["Neutrino","Pósitron","Antipróton","Múon"],a:1,x:"O pósitron, antipartícula do elétron."},
{s:"sonja",l:1,q:"Para medir uma resistência com o ohmímetro, o circuito deve estar…",o:["Ligado na fonte","Desligado","Em curto","Com o amperímetro junto"],a:1,x:"Desligado, de preferência com o resistor isolado do resto do circuito."},
{s:"sonja",l:2,q:"Qual o ângulo limite para luz saindo da água (n = 1,33) para o ar? (em graus)",n:48.8,t:0.6,u:"°",x:"sen θc = 1/1,33 = 0,752 → θc ≈ 48,8°."},
{s:"sonja",l:2,q:"Lente convergente, f = 10 cm, objeto a 15 cm. Como é a imagem?",o:["Real, invertida, 2× maior, a 30 cm","Virtual, direita, 2× maior, a 30 cm","Real, invertida, menor, a 6 cm","Virtual, direita, menor, a 6 cm"],a:0,x:"1/p' = 1/10 − 1/15 = 1/30 → p' = 30 cm. A = −30/15 = −2."},
{s:"sonja",l:2,q:"Objeto entre o foco e uma lente convergente (lupa). Como é a imagem?",o:["Real, invertida, maior","Real, direita, menor","Virtual, direita, maior","Virtual, invertida, menor"],a:2,x:"Antes do foco, a convergente forma imagem virtual, direita e ampliada."},
{s:"sonja",l:2,q:"Resistor com faixas amarelo, violeta, vermelho, ouro. Valor em ohms?",n:4700,t:0,u:"Ω",x:"Amarelo 4, violeta 7 → 47; vermelho multiplica por 10² → 4.700 Ω (4,7 kΩ), ouro ±5%."},
{s:"sonja",l:2,q:"Resistores de 100 Ω e 300 Ω em paralelo. Resistência equivalente?",n:75,t:0,u:"Ω",x:"(100 × 300) ÷ (100 + 300) = 30.000 ÷ 400 = 75 Ω."},
{s:"sonja",l:2,q:"Energia de um fóton de laser verde (532 nm), em eV.",n:2.33,t:0.03,u:"eV",x:"E = hc/λ ≈ 1240 eV·nm ÷ 532 nm ≈ 2,33 eV."},
{s:"sonja",l:2,q:"Luz não polarizada passa por dois polarizadores com eixos a 60°. Que fração da intensidade sai?",o:["1/2","1/4","1/8","3/8"],a:2,x:"1º polarizador: I₀/2. Malus: ×cos² 60° = ×1/4. Total: I₀/8."},
{s:"sonja",l:2,q:"Resistor de 10 Ω percorrido por 2 A. Potência dissipada?",n:40,t:0,u:"W",x:"P = R·i² = 10 × 4 = 40 W."},
{s:"sonja",l:2,q:"Qual era o tema da tese de Sonja em Cambridge (1948)?",o:["Radioatividade natural","Eletrodinâmica quântica: elétrons e radiação eletromagnética","Relatividade geral","Física nuclear de raios cósmicos"],a:1,x:"Problems on Electrons and Electromagnetic Radiation, em eletrodinâmica quântica."},
{s:"sonja",l:2,q:"A constante de estrutura fina, que mede a intensidade da interação eletromagnética, vale aproximadamente…",o:["1/10","1/137","1/1836","6,63 × 10⁻³⁴"],a:1,x:"α ≈ 1/137. 1836 é a razão massa do próton / massa do elétron; 6,63 × 10⁻³⁴ é h."},
{s:"sonja",l:2,q:"Sonja foi a primeira brasileira eleita membro de qual sociedade?",o:["Royal Society","Cambridge Philosophical Society","Academia Brasileira de Ciências","Sociedade Brasileira de Física"],a:1,x:"Cambridge Philosophical Society."},
{s:"sonja",l:2,q:"Frequência de um laser de 650 nm, em unidades de 10¹⁴ Hz.",n:4.62,t:0.05,u:"× 10¹⁴ Hz",x:"f = c/λ = 3,00 × 10⁸ ÷ 650 × 10⁻⁹ ≈ 4,62 × 10¹⁴ Hz."},
{s:"sonja",l:2,q:"Transformador: 110 V no primário de 500 espiras. Tensão no secundário de 50 espiras?",n:11,t:0,u:"V",x:"U₂ = U₁ × N₂/N₁ = 110 × 50/500 = 11 V."},
{s:"sonja",l:2,q:"A equação de Dirac (1928) uniu quais teorias?",o:["Mecânica clássica e termodinâmica","Mecânica quântica e relatividade especial","Relatividade geral e eletromagnetismo","Óptica e gravitação"],a:1,x:"Descreve o elétron de modo quântico e relativístico, explica o spin e prevê a antimatéria."},
{s:"sonja",l:3,q:"Laser de 650 nm numa rede de 600 linhas/mm. Ângulo do 1º máximo, em graus?",n:22.95,t:0.5,u:"°",x:"d = 1/600 mm = 1,667 µm. sen θ = 0,650/1,667 = 0,390 → θ ≈ 23,0°."},
{s:"sonja",l:3,q:"Mesma rede (600 linhas/mm) e laser de 650 nm: qual a maior ordem de difração visível?",n:2,t:0,u:"",x:"m < d/λ = 1,667/0,650 = 2,56 → ordem máxima 2."},
{s:"sonja",l:3,q:"Fenda dupla: d = 0,25 mm, anteparo a 2,0 m, laser de 650 nm. Distância entre franjas claras, em mm?",n:5.2,t:0.1,u:"mm",x:"Δy = λL/d = 650 × 10⁻⁹ × 2,0 ÷ 0,25 × 10⁻³ = 5,2 × 10⁻³ m."},
{s:"sonja",l:3,q:"Ângulo de Brewster para luz do ar incidindo em vidro de n = 1,50, em graus?",n:56.3,t:0.5,u:"°",x:"tan θB = 1,50 → θB ≈ 56,3°. Nesse ângulo, a luz refletida é totalmente polarizada."},
{s:"sonja",l:3,q:"Uma lente de +2,5 dioptrias tem distância focal de quantos centímetros?",n:40,t:0,u:"cm",x:"f = 1/V = 1/2,5 = 0,40 m = 40 cm."},
{s:"sonja",l:3,q:"Hidrogênio: comprimento de onda da transição n = 3 → n = 2, em nm (R = 1,097 × 10⁷ m⁻¹).",n:656,t:3,u:"nm",x:"1/λ = R(1/4 − 1/9) = 1,524 × 10⁶ m⁻¹ → λ ≈ 656 nm (linha vermelha de Balmer)."},
{s:"sonja",l:3,q:"Duas cargas de 1 µC a 10 cm uma da outra. Força elétrica, em newtons (k = 9 × 10⁹)?",n:0.9,t:0.02,u:"N",x:"F = k·q²/r² = 9 × 10⁹ × 10⁻¹² ÷ 0,01 = 0,9 N."},
{s:"sonja",l:3,q:"Série de 100 Ω e 300 Ω ligada a 12 V. Tensão sobre o resistor de 300 Ω?",n:9,t:0,u:"V",x:"i = 12/400 = 0,03 A. U = 300 × 0,03 = 9 V."},
{s:"sonja",l:3,q:"Fotoelétrico: luz de 400 nm em metal com função trabalho de 2,3 eV. Energia cinética máxima dos elétrons, em eV?",n:0.8,t:0.03,u:"eV",x:"hf = 1240/400 = 3,10 eV. Ec = 3,10 − 2,30 = 0,80 eV."},

/* ---------- VIRGINIA APGAR ---------- */
{s:"apgar",l:1,q:"Quantos sinais compõem o Escore de Apgar?",n:5,t:0,u:"sinais",x:"Cor, frequência cardíaca, irritabilidade reflexa, tônus e esforço respiratório."},
{s:"apgar",l:1,q:"Qual a nota máxima do Escore de Apgar?",n:10,t:0,u:"",x:"5 sinais × 2 pontos = 10."},
{s:"apgar",l:1,q:"Em que momentos o Apgar é avaliado de rotina?",o:["Ao nascer e com 1 hora","No 1º e no 5º minuto","No 5º e no 10º minuto","A cada hora no primeiro dia"],a:1,x:"No 1º e no 5º minuto após o nascimento."},
{s:"apgar",l:1,q:"Qual era a especialidade de Virginia Apgar?",o:["Pediatria","Obstetrícia","Anestesiologia","Cardiologia"],a:2,x:"Anestesista. Começou na cirurgia e migrou para a anestesia."},
{s:"apgar",l:1,q:"Recém-nascido com FC de 130 bpm recebe quanto no item pulso?",o:["0","1","2"],a:2,x:"≥ 100 bpm = 2; < 100 = 1; ausente = 0."},
{s:"apgar",l:1,q:"Corpo rosado com mãos e pés azulados (acrocianose). Nota no item cor?",o:["0","1","2"],a:1,x:"Acrocianose = 1. Só todo rosado leva 2; cianose ou palidez generalizada = 0."},
{s:"apgar",l:1,q:"Apgar de 8 no 5º minuto é classificado como…",o:["Baixo","Moderadamente anormal","Normal/tranquilizador"],a:2,x:"7–10 normal; 4–6 moderadamente anormal; 0–3 baixo."},
{s:"apgar",l:1,q:"Qual destas doenças está no teste do pezinho básico do SUS?",o:["Catarata congênita","Fenilcetonúria","Surdez congênita","Coarctação de aorta"],a:1,x:"Os 6 grupos básicos: fenilcetonúria, hipotireoidismo congênito, doença falciforme/hemoglobinopatias, fibrose cística, hiperplasia adrenal congênita e deficiência de biotinidase."},
{s:"apgar",l:1,q:"O teste do coraçãozinho é feito com…",o:["Eletrocardiograma","Ausculta","Oximetria de pulso","Ecocardiograma"],a:2,x:"Oximetria de pulso no membro superior direito e em um membro inferior."},
{s:"apgar",l:1,q:"O teste do olhinho avalia…",o:["Acuidade visual","Reflexo vermelho","Pressão intraocular","Movimentos oculares"],a:1,x:"Reflexo vermelho: rastreia catarata congênita, retinoblastoma e glaucoma."},
{s:"apgar",l:2,q:"1º minuto: FC 80, respiração fraca e irregular, alguma flexão, careta à aspiração, acrocianose. Apgar?",n:5,t:0,u:"",x:"1 + 1 + 1 + 1 + 1 = 5 (moderadamente anormal)."},
{s:"apgar",l:2,q:"5º minuto: FC 140, choro forte, movimento ativo, espirra ao estímulo, acrocianose. Apgar?",n:9,t:0,u:"",x:"2 + 2 + 2 + 2 + 1 = 9."},
{s:"apgar",l:2,q:"1º minuto: sem FC detectável, apneia, flácido, sem resposta, cianose generalizada. Apgar?",n:0,t:0,u:"",x:"Todos os sinais em 0."},
{s:"apgar",l:2,q:"Se o Apgar do 5º minuto for menor que 7, o que se faz?",o:["Nada, só registrar","Repetir a cada 5 min até 20 min","Repetir só com 1 hora","Repetir a cada minuto até chegar a 10"],a:1,x:"Repete-se a cada 5 minutos até 20 minutos de vida."},
{s:"apgar",l:2,q:"Segundo a própria Apgar, qual sinal tinha maior valor diagnóstico e prognóstico?",o:["Cor","Frequência cardíaca","Tônus","Irritabilidade reflexa"],a:1,x:"A frequência cardíaca. A cor, ao contrário, raramente recebe 2."},
{s:"apgar",l:2,q:"Em que ano o escore foi publicado?",o:["1949","1953","1959","1962"],a:1,x:"Apresentado em 1952 e publicado em 1953, com 1.021 recém-nascidos."},
{s:"apgar",l:2,q:"Teste do coraçãozinho normal:",o:["SpO₂ ≥ 90% em qualquer membro","SpO₂ ≥ 95% no MSD e no MI, diferença ≤ 3%","SpO₂ ≥ 95% só no MSD","Diferença ≥ 4% entre MSD e MI"],a:1,x:"≥ 95% nas duas medidas e diferença de até 3%."},
{s:"apgar",l:2,q:"Em que janela de tempo se faz o teste do coraçãozinho?",o:["Na sala de parto","Entre 24 e 48 h de vida","Entre o 3º e o 5º dia","Com 1 mês"],a:1,x:"Entre 24 e 48 horas, antes da alta, em RN com idade gestacional acima de 34–35 semanas."},
{s:"apgar",l:2,q:"Quando se colhe idealmente o teste do pezinho?",o:["Nas primeiras 6 horas","Entre o 3º e o 5º dia de vida","Com 15 dias","Com 1 mês"],a:1,x:"Entre o 3º e o 5º dia, após pelo menos 48 h de alimentação."},
{s:"apgar",l:2,q:"A Lei 14.154/2021 prevê a ampliação do teste do pezinho em quantas etapas?",n:5,t:0,u:"etapas",x:"5 etapas, chegando a 14 grupos de doenças (mais de 50 doenças); a última inclui a AME."},
{s:"apgar",l:2,q:"Baixo peso ao nascer é definido como…",o:["< 3.000 g","< 2.500 g","< 1.500 g","< 1.000 g"],a:1,x:"< 2.500 g. Muito baixo < 1.500 g; extremo baixo < 1.000 g."},
{s:"apgar",l:2,q:"1.500 nascidos vivos e 12 óbitos de menores de 1 ano. Taxa de mortalidade infantil (por mil)?",n:8,t:0,u:"‰",x:"12 ÷ 1.500 × 1.000 = 8,0 por mil nascidos vivos."},
{s:"apgar",l:2,q:"Recém-nascido pré-termo é aquele com idade gestacional…",o:["< 34 semanas","< 37 semanas","< 39 semanas","< 42 semanas"],a:1,x:"< 37 semanas. Termo: 37 a 41s6d. Pós-termo: ≥ 42."},
{s:"apgar",l:2,q:"Frequência cardíaca normal do recém-nascido:",o:["60–100 bpm","80–120 bpm","120–160 bpm","180–220 bpm"],a:2,x:"120–160 bpm. FR 40–60 irpm."},
{s:"apgar",l:2,q:"O período neonatal precoce vai de…",o:["0 a 6 dias","0 a 27 dias","7 a 27 dias","28 a 364 dias"],a:0,x:"Precoce 0–6 dias; tardio 7–27; pós-neonatal 28–364."},
{s:"apgar",l:3,q:"De quantas combinações diferentes dos 5 sinais resulta um Apgar 8?",n:15,t:0,u:"",x:"Dois sinais com 1 (C(5,2) = 10) ou um sinal com 0 (5): 15."},
{s:"apgar",l:3,q:"De quantas combinações resulta um Apgar 9?",n:5,t:0,u:"",x:"Um único sinal com nota 1: 5 possibilidades."},
{s:"apgar",l:3,q:"Quantas combinações de notas são possíveis no Apgar (5 sinais, 3 notas cada)?",n:243,t:0,u:"",x:"3⁵ = 243."},
{s:"apgar",l:3,q:"Doença com prevalência de 1:10.000; teste com sensibilidade 99% e especificidade 99,5%. VPP em %?",n:1.9,t:0.2,u:"%",x:"Em 100.000: VP = 9,9; FP = 0,5% de 99.990 ≈ 500. VPP = 9,9 ÷ 509,9 ≈ 1,9%."},
{s:"apgar",l:3,q:"RN nasceu com 3.400 g e pesa 3.100 g no 3º dia. Perda percentual?",n:8.8,t:0.1,u:"%",x:"300 ÷ 3.400 = 8,8%, dentro do esperado (até ≈10%)."},
{s:"apgar",l:3,q:"Bactéria que dobra a cada 20 min. Partindo de 1.000 células, quantas haverá em 2 h?",n:64000,t:0,u:"células",x:"6 duplicações: 1.000 × 2⁶ = 64.000."},
{s:"apgar",l:3,q:"Coraçãozinho: MSD 97%, membro inferior 93%. Conduta (fluxograma SBP 2022)?",o:["Normal: alta","Duvidoso: repetir em 1 hora","Alterado: ecocardiograma imediato","Repetir em 24 h"],a:1,x:"Diferença de 4% (≥ 4%) = duvidoso. Repete em 1 hora."},
{s:"apgar",l:3,q:"Teste com 90 verdadeiro-positivos e 10 falso-negativos. Sensibilidade em %?",n:90,t:0,u:"%",x:"VP ÷ (VP + FN) = 90 ÷ 100 = 90%."},
{s:"apgar",l:3,q:"950 verdadeiro-negativos e 50 falso-positivos. Especificidade em %?",n:95,t:0,u:"%",x:"VN ÷ (VN + FP) = 950 ÷ 1.000 = 95%."},
{s:"apgar",l:3,q:"Sensibilidade 90% e especificidade 95%. Razão de verossimilhança positiva?",n:18,t:0.1,u:"",x:"RV+ = sens ÷ (1 − esp) = 0,90 ÷ 0,05 = 18."},
{s:"apgar",l:3,q:"Na reanimação neonatal, o RN segue com FC < 100 bpm após os passos iniciais. Próximo passo?",o:["Massagem cardíaca","Ventilação com pressão positiva","Adrenalina","Aguardar o Apgar de 5 min"],a:1,x:"FC < 100: VPP. FC < 60 após ventilação adequada: massagem (3:1). O Apgar não decide o início da reanimação."},
{s:"apgar",l:3,q:"Se todas as 243 combinações fossem igualmente prováveis, quantas dariam Apgar ≥ 7?",n:51,t:0,u:"",x:"Combinações para 7, 8, 9, 10: 30 + 15 + 5 + 1 = 51."},

/* ---------- JOHANNA DÖBEREINER ---------- */
{s:"johanna",l:1,q:"Onde Johanna Döbereiner nasceu?",o:["Alemanha","Áustria","Antiga Tchecoslováquia","Polônia"],a:2,x:"Em Aussig (hoje Ústí nad Labem), na antiga Tchecoslováquia, em 1924."},
{s:"johanna",l:1,q:"Que gênero de bactéria fixa nitrogênio em simbiose com a soja?",o:["Azotobacter","Bradyrhizobium","Nitrosomonas","Escherichia"],a:1,x:"Bradyrhizobium japonicum e B. elkanii."},
{s:"johanna",l:1,q:"Qual enzima realiza a fixação biológica de nitrogênio?",o:["Nitrato redutase","Nitrogenase","Urease","RuBisCO"],a:1,x:"Nitrogenase: complexo Fe-proteína + MoFe-proteína."},
{s:"johanna",l:1,q:"Que porcentagem do ar é N₂?",o:["21%","50%","78%","96%"],a:2,x:"≈78%. Mas a tripla ligação torna o N₂ inacessível às plantas."},
{s:"johanna",l:1,q:"Que cultura brasileira dispensa adubo nitrogenado graças ao trabalho dela?",o:["Milho","Soja","Café","Algodão"],a:1,x:"Soja. O país virou potência agrícola economizando bilhões em adubo."},
{s:"johanna",l:1,q:"Em que instituição ela fez a maior parte de sua carreira?",o:["Embrapa (Agrobiologia, Seropédica)","Instituto Agronômico de Campinas","Esalq","Fiocruz"],a:0,x:"No km 47, em Seropédica (RJ), hoje Embrapa Agrobiologia; também na UFRRJ."},
{s:"johanna",l:1,q:"Na coloração de Gram, as bactérias Gram-negativas ficam…",o:["Roxas","Rosas/vermelhas","Verdes","Incolores"],a:1,x:"Rosas, pela safranina. Gram-positivas ficam roxas."},
{s:"johanna",l:1,q:"Em que ano ela foi indicada ao Prêmio Nobel?",o:["1964","1985","1997","2000"],a:2,x:"1997."},
{s:"johanna",l:1,q:"Qual o número atômico do nitrogênio?",n:7,t:0,u:"",x:"N: Z = 7, massa ≈ 14."},
{s:"johanna",l:2,q:"Ao cortar um nódulo de soja, o interior está rosado. O que isso indica?",o:["Nódulo inativo, infectado","Nódulo ativo, com leg-hemoglobina","Excesso de nitrogênio no solo","Contaminação por fungo"],a:1,x:"A leg-hemoglobina controla o O₂ e protege a nitrogenase. Branco, verde ou marrom = inativo."},
{s:"johanna",l:2,q:"A nitrogenase é inativada por…",o:["Gás carbônico","Oxigênio","Luz","Água"],a:1,x:"O₂. Por isso o nódulo tem leg-hemoglobina e o Azospirillum cresce logo abaixo da superfície do meio semissólido."},
{s:"johanna",l:2,q:"Quem converte NH₄⁺ em NO₂⁻ na nitrificação?",o:["Nitrobacter","Nitrosomonas","Pseudomonas","Rhizobium"],a:1,x:"Nitrosomonas (NH₄⁺ → NO₂⁻); depois Nitrobacter (NO₂⁻ → NO₃⁻)."},
{s:"johanna",l:2,q:"O que é a desnitrificação?",o:["NO₃⁻ → N₂, em ambiente anaeróbio","N₂ → NH₃","NH₄⁺ → NO₃⁻","Matéria orgânica → NH₄⁺"],a:0,x:"Devolve o nitrogênio ao ar. Ex.: Pseudomonas."},

let writeTimer = null, writing = Promise.resolve(), pendingDoc = null;
function remoteSet(p, data){
  if(backend==="sb") return fetch(SB_URL+"?on_conflict=pessoa", {method:"POST",
    headers:{apikey:SB_KEY, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"},
    body: JSON.stringify({pessoa:p, dados:data, atualizado:new Date().toISOString()})}).then(r=>{ if(!r.ok) throw {code:"http"}; });
  return db.doc("placar/"+p).set(data);
}
function queueWrite(p, data){
  if(!backend) return;
  pendingDoc = {p, data: JSON.parse(JSON.stringify(data))};
  clearTimeout(writeTimer);
  writeTimer = setTimeout(()=>{ const job = pendingDoc; pendingDoc = null; if(!job) return;
    writing = writing.then(()=>remoteSet(job.p, job.data)).catch(e=>{ dbState = e && e.code==="invalid_argument" ? "readonly" : dbState; updateSync(); }); }, 1200);
}

function ac(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){ actx = null; } return actx; }
function tone(freqs, dur, type, vol, delay){
  const c = ac(); if(!c) return; const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = type; f.type = "lowpass"; f.frequency.value = 1800;
  o.frequency.setValueAtTime(freqs[0], t0);
  for(let i=1;i<freqs.length;i++) o.frequency.linearRampToValueAtTime(freqs[i], t0 + dur*i/(freqs.length-1));
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+0.04); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
}

  bad(){ tone([311,300,240,180],0.9,"square",0.08); tone([392,380,300,220],0.9,"sawtooth",0.07); },                // buzina murchando

};

function bindQuestion(q, onAnswer){

function tally(d, st, ok){ d.stats = d.stats || {}; d.stats[st] = d.stats[st] || {n:0, ok:0}; d.stats[st].n++; if(ok) d.stats[st].ok++; d.respondidas++; if(ok) d.acertos++; }

/* ---------------- Treino progressivo ---------------- */
let tr = null;
function weakTeamStation(){ const team = {}; Object.keys(PEOPLE).forEach(p=>Object.entries(prog(p).stats||{}).forEach(([s,x])=>{ team[s]=team[s]||{n:0,ok:0}; team[s].n+=x.n; team[s].ok+=x.ok; }));
  let w = null; STATIONS.forEach(s=>{ const t = team[s]; if(t && t.n>=4 && (!w || t.ok/t.n < w.pc)) w = {s, pc:t.ok/t.n}; }); return w && w.s; }
function nextStation(){
  const p = PEOPLE[me], weak = weakTeamStation();
  const others = STATIONS.filter(s=>!p.capt.includes(s) && !p.res.includes(s));
  const bag = [];
  p.capt.forEach(s=>{ for(let i=0;i<10;i++) bag.push(s); });
  p.res.forEach(s=>{ for(let i=0;i<(s===weak?6:4);i++) bag.push(s); });
  others.forEach(s=>{ for(let i=0;i<(s===weak?4:2);i++) bag.push(s); });
  for(let i=0;i<2;i++) bag.push("enigma");
  return pick(bag);
}
function nextQuestion(){
  const st = nextStation();
  let cand = Q.filter(q=>q.s===st && !q.c && q.l===tr.diff);
  if(!cand.length) cand = Q.filter(q=>q.s===st && !q.c);
  const fresh = cand.filter(q=>!local.seen[q.id] && !tr.used.includes(q.id));
  const q = pick(fresh.length ? fresh : cand.filter(q=>!tr.used.includes(q.id)).length ? cand.filter(q=>!tr.used.includes(q.id)) : cand);
  tr.used.push(q.id); return q;
}
function startTrain(){
  const d = prog();
  tr = {i:0, results:[], diff:d.nivel, streak:0, used:[], gained:0, startLevel:d.nivel};
  showTrain();
}
function showTrain(){
  clearAll();
  const q = nextQuestion(); tr.q = q;
  const d = prog();
  app.innerHTML = topBar() + `
  <div class="hud"><div class="dots" aria-label="Progresso da rodada">${Array.from({length:ROUND},(_,i)=>`<i class="${i<tr.results.length?(tr.results[i]?"ok":"bad"):i===tr.i?"now":""}"></i>`).join("")}</div>
    <div class="row"><span class="lvl muted">DIFICULDADE ${LV[tr.diff].toUpperCase()}</span><span class="pts">${d.pontos} pts</span></div></div>
  <section class="panel">${questionHTML(q)}</section>`;
  bindTop();
  bindQuestion(q, (ok, right)=>{
    const d = prog(), was = tr.diff;
    let gain = 0;
    if(ok){ tr.streak++; gain = 10*q.l + (tr.streak>=3?5:0); d.pontos += gain; tr.gained += gain;
      if(tr.streak>=2 && tr.diff<3){ tr.diff++; tr.streak = 0; } }
    else { tr.streak = 0; if(tr.diff>1) tr.diff--; }
    d.nivel = tr.diff; tally(d, q.s, ok); local.seen[q.id] = true; setProg(me, d);
    tr.results.push(ok);
    if(tr.diff>was) setTimeout(()=>cuiudo("up"), 2000);
    const msg = tr.diff>was ? "Subiu para "+LV[tr.diff] : tr.diff<was ? "Desceu para "+LV[tr.diff] : "";
    document.getElementById("fb").innerHTML = feedback(ok, right, q.x) + `<div class="row" style="margin-top:14px">
      <button class="btn" id="next" type="button">${tr.i+1<ROUND?"Próxima":"Fechar rodada"}</button>
      ${gain?`<span class="toast">+${gain} pts</span>`:""}${msg?`<span class="lvl muted">${msg.toUpperCase()}</span>`:""}</div>`;
    const nx = document.getElementById("next"); nx.focus();
    nx.onclick = ()=>{ tr.i++; tr.i<ROUND ? showTrain() : endTrain(); };
  });
}

  simShell(`<div class="eyebrow" style="color:${col(st)}">Estação ${ST[st].name}</div>
    <h3 style="font-size:28px">O monitor avisa na porta:</h3>
    <div class="phone ${on?"on":"off"}">${on?PHONE_ON:PHONE_OFF}<span>${on?"Celular liberado nesta estação. Só o líder pode usar.":"Celular guardado nesta estação."}</span></div>
    <p class="note">${on?"Uma das perguntas exige consulta. Pesquisem sem IA: nada de resumos automáticos de buscador.":"Só vale a cabeça da equipe e o material de bancada."}</p>
    <div><button class="btn" id="go" type="button">Entrar na sala</button></div>`);
  document.getElementById("go").onclick = showSimQ;
}
function showSimQ(){
  const q = sim.qs[sim.qi], st = sim.order[sim.idx], on = sim.phone[st];
  simShell(`<div class="row" style="justify-content:space-between"><span class="eyebrow" style="color:${col(st)}">${ST[st].name} · pergunta ${sim.qi+1} de 2</span>
      <span class="lvl" style="color:var(${on?"--ok":"--bad"})">${on?"CELULAR LIBERADO":"CELULAR GUARDADO"}</span></div>
    <div>${questionHTML(q)}</div>
    <div><button class="linkbtn" id="benchBtn" type="button" aria-expanded="false">Ver material de bancada</button><div class="bench" id="bench" hidden>${BENCH[st]}</div></div>`);
  const bb = document.getElementById("benchBtn");
  bb.onclick = ()=>{ const b = document.getElementById("bench"); b.hidden = !b.hidden; bb.setAttribute("aria-expanded", !b.hidden); bb.textContent = b.hidden ? "Ver material de bancada" : "Esconder material de bancada"; };
  bindQuestion(q, (ok, right)=>{
    const d = prog(); tally(d, q.s, ok); setProg(me, d);
    const fb = document.getElementById("fb");
    if(ok){
      fb.innerHTML = feedback(true, right, q.x) + `<div class="row" style="margin-top:14px"><button class="btn" id="next" type="button">${sim.qi===0?"Próxima pergunta":"Sair da sala"}</button></div>`;
      const n = document.getElementById("next"); n.onclick = advance; n.focus();
    } else {
      sim.log[sim.idx].err++;
      const end = Date.now() + 300000;
      fb.innerHTML = feedback(false, right, q.x) + `<div class="hold"><div class="eyebrow">Retenção na estação</div><div class="t mono" id="hold">05:00</div>
        <p class="note" style="margin:6px auto 0">O relógio de prova continua correndo. Pular a espera soma o tempo que faltava.</p>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="next" type="button" disabled>Continuar</button><button class="btn ghost" id="skip" type="button">Pular espera</button></div></div>`;
      timers.push(setInterval(()=>{ const r = end - Date.now(), h = document.getElementById("hold"); if(!h) return;
        h.textContent = fmt(r); if(r<=0){ const n = document.getElementById("next"); n.disabled = false; document.getElementById("skip").hidden = true; } }, 250));
      document.getElementById("next").onclick = advance;
      document.getElementById("skip").onclick = ()=>{ sim.pen += Math.max(0, end - Date.now()); advance(); };
    }
  });
}
function advance(){
  if(sim.qi===0){ sim.qi = 1; showSimQ(); return; }
  sim.log[sim.idx].out = now(); sim.idx++;
  sim.idx<4 ? showClue() : endSim();
}
function endSim(){
  clearAll();
  const total = now(), d = prog();
  d.simulados = (d.simulados||0)+1; d.ultimoTempo = total;
  const best = d.melhorTempo==null || total < d.melhorTempo; if(best) d.melhorTempo = total;
  setProg(me, d);
  cuiudo("end");
  const errs = sim.log.reduce((a,x)=>a+x.err,0), rooms = sim.log.reduce((a,x)=>a+x.room,0);
  let prev = 0;
  app.innerHTML = topBar() + `<section class="panel stack">
    <div class="eyebrow">Chegada</div>
    <div class="big">${fmt(total)}</div>
    <p class="muted">${best?"Novo melhor tempo, já está no placar. ":""}${errs} erro${errs===1?"":"s"} e ${rooms} sala${rooms===1?"":"s"} errada${rooms===1?"":"s"}.</p>
    <div class="scroll"><table class="res"><thead><tr><th>Estação</th><th>Celular</th><th class="n">Até achar</th><th class="n">Na sala</th><th class="n">Erros</th></tr></thead><tbody>
      ${sim.log.map(x=>{ const a = x.in - prev, b = x.out - x.in; prev = x.out;
        return `<tr><td style="color:${col(x.s)};font-weight:600">${ST[x.s].name}</td><td>${sim.phone[x.s]?"liberado":"guardado"}</td><td class="n">${fmt(a)}</td><td class="n">${fmt(b)}</td><td class="n">${x.err}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="note">"Na sala" inclui a retenção. Um erro custa mais que um minuto inteiro de conferência.</p>
    <div class="row"><button class="btn" id="again" type="button">Novo simulado</button><button class="btn ghost" id="back" type="button">Ver placar</button></div>
  </section>`;
  bindTop();
  document.getElementById("again").onclick = renderBriefing;
  document.getElementById("back").onclick = renderHome;
}

/* ---------------- Conexão com o placar compartilhado ---------------- */
function startSupabase(){
  backend = "sb";
  const pull = async ()=>{
    try{
      const r = await fetch(SB_URL+"?select=pessoa,dados", {headers:{apikey:SB_KEY}, cache:"no-store"});
      if(!r.ok) throw 0;
      const next = {}; (await r.json()).forEach(x=>{ if(PEOPLE[x.pessoa] && x.dados) next[x.pessoa] = x.dados; });
      const changed = JSON.stringify(next) !== JSON.stringify(board);
      board = next; dbState = "live"; if(changed) refreshBoard();
    }catch(e){ dbState = "offline"; }
    updateSync();
  };
  pull(); setInterval(pull, 8000);
}
(async ()=>{
  if(!(window.claude && window.claude.use)){ startSupabase(); return; }
  const loadTimer = setTimeout(()=>{ if(dbState==="loading"){ dbState = "offline"; updateSync(); } }, 10000);
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db){ clearTimeout(loadTimer); dbState = "offline"; updateSync(); return; }
  backend = "claude";
  db.collection("placar").onSnapshot(snap=>{
    const next = {}; snap.docs.forEach(doc=>{ if(PEOPLE[doc.id] && doc.exists) next[doc.id] = doc.data(); });
    board = next;
    if(!snap.metadata.fromCache){ clearTimeout(loadTimer); if(dbState!=="readonly") dbState = "live"; }
    refreshBoard(); updateSync();
  }, err=>{ clearTimeout(loadTimer); dbState = "offline"; updateSync(); });
})();

me ? renderHome() : renderEntry();
</script>
